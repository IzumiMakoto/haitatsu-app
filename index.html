/* ============ 音声待機（「完了」と話すと配達完了にする） ============
   ナビ画面の🎤ボタンでオン／オフ（オン＝「待機」の状態）。
   ・待機中でも、ふだんはマイクを使わない。今向かっている配達先の約30m以内に近づいたときだけ
     ブラウザの音声認識で聞き取りを始め、約50mより離れたら止める。
     （聞き取りを始めるたびに端末が合図音を鳴らすため、走行中に鳴り続けないようにするため）
   ・「完了」「かんりょう」を含む言葉を認識したら、配達完了ボタンと同じ処理（completeCurrent）を呼ぶ
   ・アプリ自身の読み上げ中とその直後は、聞き取り結果を無視する（自分の声に反応しないため）
   ・一度反応したら4秒間は反応しない（同じ発話での二重完了を防ぐ。誤認識は「一つ戻る」で取り消せる）
   ・聞き取り中にブラウザが止まったら自動で再開する（近くにいる間だけ）
   ・ナビ画面に入るたびに自動でオンになる（🎤で手動オフにすると、その画面を離れるまでオフ）
   ・ナビ画面を離れるとオフに戻る（マイクを使い続けないため）
   ・「一つ戻る」と話すと「↩ 一つ戻る」ボタンと同じ処理（goBackOne）を呼ぶ */
let voiceMuteUntil = 0;
let voiceRec = null;
let voiceRestartTimer = null;
let voiceLastTriggerAt = 0;
let voiceFailCount = 0;
let voiceInRange = false;                 // 今、配達先の近くにいて聞き取りの対象になっているか
const VOICE_LISTEN_START_M = 30;          // この距離以内に近づいたら聞き取りを始める（メートル）
const VOICE_LISTEN_STOP_M  = 50;          // この距離より離れたら聞き取りを止める（GPSのブレで入り切りしないよう、始める距離より大きくしてある）
const VOICE_TRIGGER_RE = /完了|かんりょう|カンリョウ/;
const VOICE_BACK_RE = /戻る|もどる|戻って|もどって|戻り|(一|ひと|1|１)つ前/;   // 「一つ戻る」ボタンと同じ操作
let voiceReady = false;                   // 端末の聞き取りが実際に始まって、今話せば拾える状態か（🎤が緑になる）
let voiceNear = false;                    // 今向かっている配達先の近く（30m以内）にいるか（「完了」に反応してよいか）
let voiceUndoUntil = 0;                   // 完了の直後、この時刻までは距離に関係なく「一つ戻る」だけ聞き取る
const VOICE_UNDO_WINDOW_MS = 8000;
let voiceUndoTimer = null;
let voiceAutoArmed = false;               // ナビ画面に入ったときの自動オンを、この入室で済ませたか（離れると戻る）

// ボタンの見た目：オフ＝灰色／待機中（まだ遠い）＝黄色の枠／聞き取り中（近い）＝黄色＋脈打つ
function updateVoiceStandbyBtn(){
  const btn = document.getElementById('voiceStandbyBtn');
  if(!btn) return;
  const armed = !!state.voiceStandbyOn;
  const listening = armed && voiceInRange;
  btn.classList.toggle('vs-armed', armed);
  btn.classList.toggle('vs-listening', listening);
  btn.classList.toggle('vs-ready', listening && voiceReady);
  btn.classList.toggle('active-pan', listening);
}
// マイクの許可は、🎤を押したとき（操作した直後）に確認しておく。
// 走行中に、配達先に近づいた拍子に許可の確認画面が出てしまわないようにするため。
async function voiceStandbyPrimeMic(){
  try{
    if(navigator.permissions && navigator.permissions.query){
      const st = await navigator.permissions.query({name:'microphone'});
      if(st.state === 'granted') return true;
      if(st.state === 'denied') return false;
    }
  }catch(e){ /* この端末では権限の事前確認ができない。下の方法で確認する */ }
  try{
    if(navigator.mediaDevices && navigator.mediaDevices.getUserMedia){
      const stream = await navigator.mediaDevices.getUserMedia({audio:true});
      stream.getTracks().forEach(t=>t.stop());
    }
    return true;
  }catch(e){
    return false;
  }
}
function toggleVoiceStandby(){
  if(state.voiceStandbyOn){
    stopVoiceStandby();
    toast('🎤 音声待機をオフにしました');
    return;
  }
  startVoiceStandby(false);
}
// 音声待機をオンにする（auto=true：ナビ画面に入ったときの自動オン。非対応の端末では何も言わずにそのまま）
function startVoiceStandby(auto){
  const Ctor = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!Ctor){
    if(!auto) toast('お使いの端末・ブラウザは音声待機に対応していません', 4000);
    return;
  }
  state.voiceStandbyOn = true;
  voiceFailCount = 0;
  voiceInRange = false; voiceNear = false; voiceUndoUntil = 0;
  updateVoiceStandbyBtn();
  toast('🎤 音声待機オン：配達先の約' + VOICE_LISTEN_START_M + 'm以内に近づくと聞き取りを始めます。「完了」で完了、「一つ戻る」で一つ戻ります', 5000);
  voiceStandbyPrimeMic().then(ok=>{
    if(!state.voiceStandbyOn) return;
    if(!ok){
      stopVoiceStandby();
      toast('マイクの使用が許可されていないため、音声待機を止めました。ブラウザの設定でマイクを許可してください', 6000);
      return;
    }
    voiceStandbyEvaluateNow();
  });
}
// 聞き取りだけを止める（待機＝オンの状態は保つ）
function voiceStandbyPauseListening(){
  voiceReady = false;
  clearTimeout(voiceRestartTimer); voiceRestartTimer = null;
  if(voiceRec){
    const r = voiceRec; voiceRec = null;
    r.onend = null; r.onerror = null; r.onresult = null;
    try{ r.abort(); }catch(e){}
  }
}
// 待機そのものをやめる（オフにする）
function stopVoiceStandby(){
  state.voiceStandbyOn = false;
  voiceInRange = false; voiceNear = false; voiceUndoUntil = 0;
  voiceStandbyPauseListening();
  updateVoiceStandbyBtn();
}
// 配達先までの距離に応じて、聞き取りを始める／止める（dist=nullは「向かう配達先が無い」）
function voiceStandbyProximity(dist){
  if(!state.voiceStandbyOn) return;
  // 距離による判定（30m以内に入ったら近い、50mより離れたら遠い）
  let near = voiceNear;
  if(dist == null) near = false;
  else if(!voiceNear && dist <= VOICE_LISTEN_START_M) near = true;
  else if(voiceNear && dist > VOICE_LISTEN_STOP_M) near = false;
  voiceNear = near;
  // 完了の直後は、離れていても少しの間だけ聞き取る（「一つ戻る」で取り消せるように）
  const undoActive = Date.now() < voiceUndoUntil && state.progress.done.length > 0;
  let next = near || undoActive;
  // 完了の直後は、まだ前の配達先の距離で判定されて再開してしまわないよう、少し待つ
  if(next && Date.now() - voiceLastTriggerAt < 1500) next = false;
  if(next === voiceInRange) return;
  voiceInRange = next;
  if(voiceInRange) voiceStandbyBegin(); else voiceStandbyPauseListening();
  updateVoiceStandbyBtn();
}
// 完了にした直後に、「一つ戻る」を聞き取る時間を開く（ボタンで完了にした場合も同じ）
function voiceStandbyOpenUndoWindow(){
  if(!state.voiceStandbyOn) return;
  voiceUndoUntil = Date.now() + VOICE_UNDO_WINDOW_MS;
  clearTimeout(voiceUndoTimer);
  voiceUndoTimer = setTimeout(voiceStandbyEvaluateNow, VOICE_UNDO_WINDOW_MS + 100);
  setTimeout(voiceStandbyEvaluateNow, 1700);
}
// いま分かっている現在地で、すぐに判定する（🎤をオンにした直後や、画面に戻ってきたときに使う）
function voiceStandbyEvaluateNow(){
  if(!state.voiceStandbyOn) return;
  const t = byId(currentTargetId());
  if(!t || !state.pos){ voiceStandbyProximity(null); return; }
  voiceStandbyProximity(haversine(state.pos.lat, state.pos.lng, t.lat, t.lng));
}
function voiceStandbyHandleResult(ev){
  voiceFailCount = 0; // 聞き取れている間は、失敗回数をリセットする
  if(!state.voiceStandbyOn || state.view!=='nav') return;
  const now = Date.now();
  if(now < voiceMuteUntil) return;                 // アプリ自身の読み上げ中・直後
  let text = '';
  for(let i = ev.resultIndex; i < ev.results.length; i++){
    for(let j = 0; j < ev.results[i].length; j++) text += ev.results[i][j].transcript + ' ';
  }
  const t = text.replace(/\s+/g,'');
  if(VOICE_BACK_RE.test(t)){
    // 「一つ戻る」ボタンと同じ処理。戻れる配達先が無いときは何もしない
    if(!state.progress.done.length) return;
    if(now - voiceLastTriggerAt < 1500) return;    // 同じ発話での二重反応を防ぐ
    voiceLastTriggerAt = now;
    voiceUndoUntil = 0;
    toast('🎤 「' + t.slice(0,12) + '」→ 一つ戻ります', 3000);
    goBackOne();
    voiceInRange = false;
    voiceStandbyPauseListening();
    updateVoiceStandbyBtn();
    return;
  }
  if(!VOICE_TRIGGER_RE.test(t)) return;
  if(!voiceNear) return;                           // 「完了」は配達先の近く（30m以内）でだけ反応する
  if(now - voiceLastTriggerAt < 4000) return;      // 直前に反応したばかり
  if(!currentTargetId()) return;
  voiceLastTriggerAt = now;
  toast('🎤 「' + t.slice(0,12) + '」→ 配達完了にします', 3000);
  completeCurrent();
  // 完了にしたので、いったん聞き取りを止める。直後は「一つ戻る」だけ聞き取る時間が開き、
  // 次の配達先がすぐ近くなら、距離の判定で「完了」も聞き取る
  voiceNear = false;
  voiceInRange = false;
  voiceStandbyPauseListening();
  updateVoiceStandbyBtn();
}
function voiceStandbyBegin(){
  if(!state.voiceStandbyOn || !voiceInRange || voiceRec) return;
  if(state.view!=='nav'){ stopVoiceStandby(); return; }
  if(document.hidden) return; // 画面が隠れている間は始めない（戻ってきたときに再開する）
  const Ctor = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!Ctor){ stopVoiceStandby(); return; }
  try{
    const rec = new Ctor();
    rec.lang = 'ja-JP';
    rec.continuous = true;        // 話し終わるたびに止まらず、聞き続ける（止まって再開するまでの空白で聞き逃さないため）
    rec.interimResults = true;    // 話し終わりを待たず、認識途中でも反応する（反応を早くするため）
    rec.maxAlternatives = 3;
    // 電子音のあと、聞き取りが本当に始まった瞬間に🎤を緑にする。緑の間に話せば拾える
    rec.onaudiostart = ()=>{ if(voiceRec === rec){ voiceReady = true; updateVoiceStandbyBtn(); } };
    rec.onresult = voiceStandbyHandleResult;
    rec.onerror = (e)=>{
      const err = e && e.error;
      if(err === 'not-allowed' || err === 'service-not-allowed'){
        stopVoiceStandby();
        toast('マイクの使用が許可されていないため、音声待機を止めました。ブラウザの設定でマイクを許可してください', 6000);
        return;
      }
      if(err === 'network' || err === 'audio-capture') voiceFailCount++;
      // 'no-speech'（無音）や 'aborted' は通常の動作。onend で自動再開する
    };
    rec.onend = ()=>{
      if(voiceRec === rec) voiceRec = null;
      voiceReady = false; updateVoiceStandbyBtn();
      if(!state.voiceStandbyOn || !voiceInRange) return; // 待機をやめた／配達先から離れた
      if(state.view!=='nav'){ stopVoiceStandby(); return; }
      if(voiceFailCount >= 5){
        stopVoiceStandby();
        toast('音声認識が続けて失敗したため、音声待機を止めました（通信状況をご確認ください）', 6000);
        return;
      }
      clearTimeout(voiceRestartTimer);
      voiceRestartTimer = setTimeout(voiceStandbyBegin, Math.min(60 + voiceFailCount * 800, 4000));
    };
    voiceRec = rec;
    rec.start();
  }catch(e){
    voiceRec = null;
    voiceFailCount++;
    if(voiceFailCount >= 5){ stopVoiceStandby(); toast('音声待機を開始できませんでした', 4000); return; }
    clearTimeout(voiceRestartTimer);
    voiceRestartTimer = setTimeout(voiceStandbyBegin, 1500);
  }
}
// 他のアプリに切り替えている間は聞き取りを止め、戻ってきたら（まだ近ければ）再開する
document.addEventListener('visibilitychange', ()=>{
  if(!state.voiceStandbyOn) return;
  if(document.hidden){
    voiceInRange = false;
    voiceStandbyPauseListening();
    updateVoiceStandbyBtn();
  } else {
    voiceFailCount = 0;
    voiceStandbyEvaluateNow();
  }
});

function buildDoneMeta(id, method){
  const tr = state.proximityTracking[id];
  const passedFast = !!(tr && tr.samples >= 2 && !tr.stopped && tr.minSpeed != null && tr.minSpeed >= state.settings.stopSpeedKmh * 3);
  return {
    method,
    time: Date.now(),
    accuracy: state.pos ? state.pos.accuracy : null,
    passedFast,
    minSpeedNear: tr ? tr.minSpeed : null,
    pos: state.pos ? {lat: state.pos.lat, lng: state.pos.lng} : null // 完了した瞬間の自分の位置（ピンの座標とは別に記録する）
  };
}

function clearPassedFlag(id){
  delete state.approachTracking[id];
  delete state.arrivalHoldTracking[id];
  delete state.distanceHoldTracking[id];
}

async function completeCurrent(){
  const id = currentTargetId();
  if(!id) return;
  // 短時間（0.8秒以内）に連続で押された場合は、誤って2回連続タップしたとみなして無視する
  const now = Date.now();
  if(state.completingLock && now - state.completingLock < 800) return;
  state.completingLock = now;
  const btn = document.getElementById('completeBtn');
  if(btn) btn.disabled = true; // 押した瞬間に見た目でも押せなくする（次の配達先に切り替わると自動的に元に戻る）
  const target = byId(id);
  state.progress.done.push(id);
  state.progress.doneMeta[id] = buildDoneMeta(id, 'manual');
  clearPassedFlag(id);
  await storeSet('progress', state.progress);
  voiceStandbyOpenUndoWindow();
  speak('配達を完了しました。');
  showArrivalBanner(`${target ? target.name : ''}\n配達完了`);
  state.followMode = true; resumeRotationForFollow(); // 次の配達先に移るので、現在地への追従を自動的に再開する
  render();
  startWatch();
}
function skipCurrent(){
  const remaining = remainingRoute();
  if(remaining.length<2) { toast('これ以上スキップできません'); return; }
  const id = currentTargetId();
  if(!id) return;
  if(!state.progress.skippedIds.includes(id)) state.progress.skippedIds.push(id);
  storeSet('progress', state.progress);
  const idx = state.routeOrder.indexOf(id);
  state.routeOrder.splice(idx,1);
  state.routeOrder.push(id);
  state.followMode = true; resumeRotationForFollow(); // 次の配達先に移るので、現在地への追従を自動的に再開する
  render();
  startWatch();
}
async function goBackOne(){
  const lastId = state.progress.done.length ? state.progress.done[state.progress.done.length-1] : null;
  if(!lastId){ toast('戻れる配達先がありません'); return; }
  await restorePoint(lastId, true);
}
async function restorePoint(id, isGoBack){
  const m = byId(id);
  state.progress.done = state.progress.done.filter(x=>x!==id);
  if(state.progress.doneMeta) delete state.progress.doneMeta[id];
  delete state.announced[id];
  delete state.proximityTracking[id];
  delete state.approachTracking[id];
  delete state.arrivalHoldTracking[id];
  delete state.distanceHoldTracking[id];
  await storeSet('progress', state.progress);
  toast((isGoBack ? '↩ 前の配達先に戻りました：' : 'やり直しに設定しました：') + (m?m.name:''));
  render();
  startWatch();
}
// 「保存しました」の読み上げ。保存できたことを確実に伝えるため、音声案内の🔊をオフにしていても読み上げる（V50.9）
function speakSaved(){
  const wasVoice = state.settings.voice;
  state.settings.voice = true;
  speak('保存しました。');
  state.settings.voice = wasVoice;
}
function speakCurrent(){
  const id = currentTargetId();
  if(!id) return;
  const m = byId(id);
  const wasVoice = state.settings.voice;
  state.settings.voice = true;
  speak(`次は、${m.name}です。${m.memo?('メモ、'+m.memo):''}`);
  state.settings.voice = wasVoice;
}

function toggleTrailRecording(){
  state.trailRecordingPaused = !state.trailRecordingPaused;
  toast(state.trailRecordingPaused ? '📥 ここまでの軌跡を履歴に保存しました' : '▶ 軌跡の記録を再開しました', 3500);
  render();
}

/* ---- geolocation watch ---- */
/* ============ 画面スリープ防止（Wake Lock） ============
   ナビ画面を開いている間、しばらく画面を触らなくても自動で暗くならないようにする。
   対応していないブラウザでは何もしない（try/catchで無視）。 */
let wakeLockSentinel = null;
async function acquireWakeLock(){
  if(!state.settings.keepScreenOn) return;
  try{
    if('wakeLock' in navigator){
      wakeLockSentinel = await navigator.wakeLock.request('screen');
    }
  }catch(e){}
}
function releaseWakeLock(){
  try{ if(wakeLockSentinel){ wakeLockSentinel.release(); wakeLockSentinel = null; } }catch(e){}
}
try{
  document.addEventListener('visibilitychange', ()=>{
    // 画面ロック解除などでアプリに戻ってきたとき、ナビ中ならスリープ防止を再取得する
    // （Wake Lockはアプリがバックグラウンドに回ると自動的に解除される仕様のため）
    if(document.visibilityState === 'visible' && (state.view === 'nav' || state.view === 'checkloc')){
      acquireWakeLock();
    }
  });
}catch(e){}

/* ============ バッテリー残量が少なくなったときの警告 ============
   40%で「そろそろ充電の準備を」という軽い警告、30%まで下がったら「充電してください」という
   本格的な警告を出す2段階方式。 */
let batteryWatchAttached = false;
let batteryWarning40Shown = false;
let batteryWarning30Shown = false;
async function setupBatteryWarning(){
  try{
    if(batteryWatchAttached || !navigator.getBattery) return;
    batteryWatchAttached = true;
    const battery = await navigator.getBattery();
    function checkBattery(){
      if(!battery.charging){
        if(battery.level <= 0.30 && !batteryWarning30Shown){
          batteryWarning30Shown = true;
          toast('🔋 バッテリー残量が少なくなっています（' + Math.round(battery.level*100) + '%）。充電してください。');
        } else if(battery.level <= 0.40 && battery.level > 0.30 && !batteryWarning40Shown){
          batteryWarning40Shown = true;
          toast('🔋 バッテリー残量が減ってきています（' + Math.round(battery.level*100) + '%）。そろそろ充電の準備をしてください。');
        }
      }
      if(battery.charging || battery.level > 0.45){
        // 充電された、またはある程度回復したら、また減ったときに両方とも警告できるようにリセットする
        batteryWarning40Shown = false;
        batteryWarning30Shown = false;
      }
    }
    battery.addEventListener('levelchange', checkBattery);
    battery.addEventListener('chargingchange', checkBattery);
    checkBattery();
  }catch(e){}
}

function stopWatch(){
  if(state.watchId!==null && navigator.geolocation){
    navigator.geolocation.clearWatch(state.watchId);
    state.watchId = null;
  }
  releaseWakeLock();
}
function startWatch(){
  stopWatch();
  if(state.view!=='nav' && state.view!=='checkloc') return;
  acquireWakeLock();
  setupBatteryWarning();
  // 以前はここで「残りの配達が0件なら何もしない」としていたが、
  // それだと最後の1件を完了した瞬間にGPSの追跡が止まり、二度と再開されなくなっていた
  // （全件完了後も自車位置・軌跡の記録を続けたいという要望と矛盾していたため、削除した）。
  if(!navigator.geolocation){
    const w = document.getElementById('gpsWarn');
    if(w){ w.style.display='block'; w.textContent='この端末では位置情報が利用できません。手動で「配達完了」を押して進めてください。'; }
    return;
  }
  // file:// で直接開いている場合、ブラウザによっては位置情報がセキュリティ上の理由で
  // 動作しないことがあるため、事前に注意を表示しておく
  if(location.protocol === 'file:'){
    const w = document.getElementById('gpsWarn');
    if(w){
      w.style.display='block';
      w.textContent = 'メールの添付ファイルなどから直接開いている場合、端末によっては位置情報が動作しないことがあります。うまく動かない場合は下の「設定」からご相談ください。';
    }
  }
  state.watchId = navigator.geolocation.watchPosition(onPosition, onPosError, {
    enableHighAccuracy:true,
    maximumAge: 0, // 常に最新の位置情報だけを使う（精度優先）
    timeout:15000
  });
}
function onPosError(err){
  const w = document.getElementById('gpsWarn');
  if(w){
    w.style.display='block';
    let msg = '位置情報を取得できません（' + (err.message||'') + '）。手動で「配達完了」を押して進めてください。';
    if(location.protocol === 'file:'){
      msg += '\nファイルを直接開いていることが原因の可能性があります。ホームページ（HTTPS）にアップロードして開くと解決する場合があります。';
    }
    w.textContent = msg;
    w.style.whiteSpace = 'pre-wrap';
  }
}
function onPosition(pos){
  const now = Date.now();
  let speedKmh = null;
  if(pos.coords.speed != null && !isNaN(pos.coords.speed) && pos.coords.speed >= 0){
    speedKmh = pos.coords.speed * 3.6;
  } else if(state.lastPosRaw){
    const dt = (now - state.lastPosRaw.time) / 1000;
    if(dt >= 0.8){
      const distM = haversine(state.lastPosRaw.lat, state.lastPosRaw.lng, pos.coords.latitude, pos.coords.longitude);
      speedKmh = (distM/dt) * 3.6;
    }
  }
  // 自分の位置マーカー（矢印）とヘディングアップ表示（走行中）の両方に使うため、
  // GPSの移動から進行方向を計算する。
  // 端末のGPSチップが直接計算した進行方向（coords.heading）が使える場合は、
  // それを優先する。これは電波のドップラー効果などから求められる値で、
  // 2点の位置から計算するより、GPSの位置誤差の影響を受けにくく安定している。
  // 使えない端末では、これまで通り2点間の角度から計算するが、GPSの誤差に埋もれて
  // 進行方向が暴れないよう、ある程度まとまった距離動いてから計算し直すようにし、
  // さらに急な変化を軽くならす（円環平均で平滑化する）ことで、地図がくるくる回って
  // 見える揺れを抑える。
  const hasNativeHeading = pos.coords.heading != null && !isNaN(pos.coords.heading)
    && speedKmh != null && speedKmh >= GPS_HEADING_MIN_KMH;
  let rawHeadingSample = null;
  if(hasNativeHeading){
    rawHeadingSample = pos.coords.heading;
    state.movementHeadingUpdatedAt = now;
  } else if(state.lastPosRaw){
    const movedM = haversine(state.lastPosRaw.lat, state.lastPosRaw.lng, pos.coords.latitude, pos.coords.longitude);
    if(movedM >= MOVEMENT_HEADING_MIN_DISTANCE_M){
      rawHeadingSample = bearing(state.lastPosRaw.lat, state.lastPosRaw.lng, pos.coords.latitude, pos.coords.longitude);
      state.movementHeadingUpdatedAt = now;
    }
  }
  if(rawHeadingSample != null){
    const rad = rawHeadingSample * Math.PI / 180;
    if(state.movementHeadingSmoothX == null){
      state.movementHeadingSmoothX = Math.cos(rad);
      state.movementHeadingSmoothY = Math.sin(rad);
    } else {
      const prevAngle = (Math.atan2(state.movementHeadingSmoothY, state.movementHeadingSmoothX) * 180 / Math.PI + 360) % 360;
      let sampleDiff = Math.abs(rawHeadingSample - prevAngle);
      if(sampleDiff > 180) sampleDiff = 360 - sampleDiff;

      let alpha = 0.18; // 新しいサンプルをどれだけ強く反映するか（小さいほど滑らかだが反応は遅くなる）※低速時の不要な回転を減らすため、以前(0.35)より弱めた
      // 直前の向きから大きく（40度以上）ズレたサンプルは、GPSの一時的な誤差の可能性があるため、
      // ジャイロが実際の回転を裏付けている場合だけ強く反映し、そうでなければ弱く抑える
      // （コンパスの外れ値除去と同じ考え方を、走行中のGPS方位にも広げたもの）。
      if(sampleDiff > 40){
        const gyroConfirms = (typeof gyroRotationMagnitude !== 'undefined') && gyroRotationMagnitude >= GYRO_TURN_THRESHOLD;
        alpha = gyroConfirms ? 0.5 : 0.05;
      }
      state.movementHeadingSmoothX = state.movementHeadingSmoothX * (1 - alpha) + Math.cos(rad) * alpha;
      state.movementHeadingSmoothY = state.movementHeadingSmoothY * (1 - alpha) + Math.sin(rad) * alpha;
    }
    state.movementHeading = (Math.atan2(state.movementHeadingSmoothY, state.movementHeadingSmoothX) * 180 / Math.PI + 360) % 360;
  }
  state.lastPosRaw = {lat:pos.coords.latitude, lng:pos.coords.longitude, time: now};
  state.pos = {lat:pos.coords.latitude, lng:pos.coords.longitude, accuracy: pos.coords.accuracy, speedKmh};
  recordTrailPoint(now);
  updateNavUI();
  // 矢印（自分の位置マーカー）の向きは updateMiniMap の中で更新されるため、
  // GPSが更新されるたびに必ず呼び出す（今までは他の操作のときにしか呼ばれておらず、
  // 歩行中に矢印がほとんど動かないように見える原因になっていた）
  try{ updateMiniMap(state.view==='checkloc' ? null : byId(currentTargetId())); }catch(e){}
  applyMapRotationIfChanged(); // 走行中はGPSの進行方向が更新されるたびに地図の向きも追従させる
}

/* ---- 配達中の軌跡（実際に通った道）の記録・表示 ---- */
const TRAIL_MIN_DISTANCE_M = 10;  // 通常はこの距離以上動いたら新しい点を記録
const TRAIL_MIN_INTERVAL_MS = 15000; // 動きが少なくても、この時間が経てば点を記録（停止の検知用）

function recordTrailPoint(now){
  if(state.trailRecordingPaused) return; // 自分で「記録を停止」している間は何もしない
  if(!state.progress.trail) state.progress.trail = [];
  const trail = state.progress.trail;
  const last = trail.length ? trail[trail.length-1] : null;
  const isStopped = state.pos.speedKmh != null && state.pos.speedKmh < state.settings.stopSpeedKmh;

  let shouldAdd = false;
  if(!last){
    shouldAdd = true;
  } else {
    const distM = haversine(last.lat, last.lng, state.pos.lat, state.pos.lng);
    const elapsed = now - last.time;
    if(distM >= TRAIL_MIN_DISTANCE_M || elapsed >= TRAIL_MIN_INTERVAL_MS){
      shouldAdd = true;
    }
  }
  if(!shouldAdd) return;

  trail.push({lat: state.pos.lat, lng: state.pos.lng, time: now, stopped: isStopped});
  // 長時間の配達で肥大化しすぎないよう、上限を設けておく
  if(trail.length > 2000) trail.splice(0, trail.length - 2000);

  drawTrailPoint(trail[trail.length-1], trail.length>=2 ? trail[trail.length-2] : null);

  // 保存の頻度を抑えるため、5点ごとに書き込む
  if(trail.length % 5 === 0){
    storeSet('progress', state.progress);
  }
}

function drawTrailPoint(point, prevPoint){
  if(!state.miniMap || typeof L==='undefined') return;
  try{
    if(prevPoint){
      if(!state.trailLine){
        state.trailLine = L.polyline([[prevPoint.lat,prevPoint.lng],[point.lat,point.lng]], {color:'#7fa8e0', weight:6, opacity:0.8}).addTo(state.miniMap);
      } else {
        const latlngs = state.trailLine.getLatLngs ? state.trailLine.getLatLngs() : [];
        latlngs.push([point.lat, point.lng]);
        state.trailLine.setLatLngs(latlngs);
      }
    }
    const dot = L.circleMarker([point.lat, point.lng], point.stopped
      ? {radius:5, color:'#e0453a', fillColor:'#e0453a', fillOpacity:0.9, weight:1, interactive:false}
      : {radius:2.5, color:'#7fa8e0', fillColor:'#7fa8e0', fillOpacity:0.8, weight:1, interactive:false}
    ).addTo(state.miniMap);
    state.trailDotLayers.push(dot);
  }catch(e){}
}

function redrawFullTrail(){
  if(!state.miniMap || typeof L==='undefined') return;
  if(state.trailLine){ try{ state.miniMap.removeLayer(state.trailLine); }catch(e){} state.trailLine = null; }
  state.trailDotLayers.forEach(d=>{ try{ state.miniMap.removeLayer(d); }catch(e){} });
  state.trailDotLayers = [];
  const trail = state.progress.trail || [];
  if(!trail.length) return;
  try{
    if(trail.length >= 2){
      state.trailLine = L.polyline(trail.map(p=>[p.lat,p.lng]), {color:'#7fa8e0', weight:6, opacity:0.8}).addTo(state.miniMap);
    }
    trail.forEach(point=>{
      const dot = L.circleMarker([point.lat, point.lng], point.stopped
        ? {radius:5, color:'#e0453a', fillColor:'#e0453a', fillOpacity:0.9, weight:1, interactive:false}
        : {radius:2.5, color:'#7fa8e0', fillColor:'#7fa8e0', fillOpacity:0.8, weight:1, interactive:false}
      ).addTo(state.miniMap);
      state.trailDotLayers.push(dot);
    });
  }catch(e){}
}

function zoomForDistance(dist){
  if(dist > 300) return 15;
  if(dist > 150) return 16;
  if(dist > 60) return 17;
  return 18;
}
// ナビ画面では下部に暗いカード（配達先名・ボタンなど）が重なって地図の下側を隠すため、
// setViewやpanToの「中心」をそのまま使うと、実際に見えている範囲では中心がずれて見える。
// そこで、隠れている高さの半分だけ南（画面奥）にずらした位置を「中心」として使うことで、
// 実際に見える範囲のちょうど真ん中に現在地・目的地が来るよう補正する。
// カードの高さは、配達先名やメモの有無・長さによって変わるため、固定値ではなく
// その都度実際の高さを画面から測って使う（transform-origin（CSS側の回転軸）も
// このオフセットと必ず一致させる必要があるため、下のsyncMiniMapTransformOriginで
// 毎回一緒に更新する）。
const NAV_BOTTOM_CARD_OFFSET_FALLBACK_PX = 130; // カードがまだ描画されていない場合の初期値
function getBottomCardOffsetPx(){
  try{
    const card = document.querySelector('.nav-fullscreen .nav-bottom-card');
    if(card){
      const h = card.getBoundingClientRect().height;
      if(h > 0) return h / 2;
    }
  }catch(e){}
  return NAV_BOTTOM_CARD_OFFSET_FALLBACK_PX;
}
// 自車の追従（運転中ずっと動く処理）は、常に生の自車位置をそのまま地図の中心にしている
// （下部カード分のズラしはしない。参照: adjustCenterForBottomCardの説明）。
// そのため、地図の回転もそのまま「画面の真ん中＝自車の位置」を軸にすればよく、
// 軸をずらす計算は不要（シンプルな方が安定して動く）。
function syncMiniMapTransformOrigin(){
  const el = document.getElementById('miniMap');
  if(!el) return;
  el.style.transformOrigin = '50% 50%';
}
function adjustCenterForBottomCard(latlng, zoom){
  if(!state.miniMap) return latlng;
  try{
    const z = zoom != null ? zoom : state.miniMap.getZoom();
    const pt = state.miniMap.project(latlng, z);
    const offsetPx = getBottomCardOffsetPx();
    // project()が返す座標は、#miniMapが回転していないと仮定したLeaflet内部の座標。
    // ここで単純に[0, OFFSET]（内部座標の「下」）をずらすと、地図が回転しているときに
    // 画面上での「下」とズレてしまい、目的地が意図しない方向にずれて表示される
    // （🎯ボタンを押すたびに変な位置に飛ぶ不具合の原因）。
    // 常に「画面上で見て真下」にずれるよう、回転角度ぶん逆方向に補正してから内部座標に足す。
    const angleDeg = getMiniMapRotationDeg();
    const rad = angleDeg * Math.PI / 180;
    const offsetVec = [offsetPx * Math.sin(rad), offsetPx * Math.cos(rad)];
    const adjusted = pt.add(offsetVec);
    return state.miniMap.unproject(adjusted, z);
  }catch(e){ return latlng; }
}

function updateProximityZoom(dist, target){
  if(!state.miniMap || state.manualPan || state.settings.zoomLocked || !state.followMode) return;
  const tier = zoomForDistance(dist);
  if(state.lastAutoZoomTier === tier && state.lastAutoZoomTargetId === target.id) return;
  state.lastAutoZoomTier = tier;
  state.lastAutoZoomTargetId = target.id;
  try{
    const center = state.pos ? [state.pos.lat, state.pos.lng] : [target.lat, target.lng];
    state.__programmaticZoom = true;
    state.miniMap.setView(center, tier, {animate:true});
    setTimeout(()=>{ state.__programmaticZoom = false; }, 50);
  }catch(e){}
}

function updateNavUI(){
  if((state.view!=='nav' && state.view!=='checkloc') || !state.pos) return;
  const targetId = currentTargetId();
  if(!targetId){
    voiceStandbyProximity(null); // 向かう配達先が無いので、音声待機の聞き取りは止める
    // 全件配達完了後：目的地が無いので距離表示や自動完了判定などは不要だが、
    // 「現在地に戻る（追従）」がONの間は、これまでのナビ画面と同じように
    // 自分の位置を画面中央に保ち続ける。縮尺はここでは一切変更しない
    // （配達が終わった時点の縮尺のまま）。
    if(state.followMode && !state.manualPan && state.miniMap){
      try{
        state.__programmaticZoom = true;
        const centerPt = [state.pos.lat, state.pos.lng];
        state.miniMap.panTo(centerPt, {animate:true});
        setTimeout(()=>{ state.__programmaticZoom = false; }, 50);
      }catch(e){}
    }
    return;
  }
  const target = byId(targetId);
  if(!target) return;
  const dist = Math.round(haversine(state.pos.lat, state.pos.lng, target.lat, target.lng));
  const brg = bearing(state.pos.lat, state.pos.lng, target.lat, target.lng);
  voiceStandbyProximity(dist); // 音声待機：配達先の近くにいる間だけ聞き取る

  // 対象地点付近での速度を記録（停止せず通過したかどうかの判定に使う）
  const PROX_RADIUS = 35; // メートル
  if(dist <= PROX_RADIUS){
    if(!state.proximityTracking[target.id]) state.proximityTracking[target.id] = {minSpeed:null, stopped:false, samples:0};
    const tr = state.proximityTracking[target.id];
    if(state.pos.speedKmh != null){
      tr.samples++;
      tr.minSpeed = (tr.minSpeed==null) ? state.pos.speedKmh : Math.min(tr.minSpeed, state.pos.speedKmh);
      if(state.pos.speedKmh < state.settings.stopSpeedKmh) tr.stopped = true;
    }
  }

  // 目的地への最短距離を記録し続ける（押し忘れ確認の判定に使う）
  if(!state.approachTracking[target.id]){
    state.approachTracking[target.id] = {minDist: dist, flagged:false};
  }
  const atr = state.approachTracking[target.id];
  if(dist < atr.minDist) atr.minDist = dist;

  // 押し忘れ防止：自動判定のON/OFFを問わず、「目的地に一番近づいた距離からの増加」で判定する。
  // （「止まった場所」を基準にすると、信号待ちなど目的地と関係ない場所からの移動でも
  // 誤反応してしまうため、上のapproachTrackingと同じ「目的地との距離そのもの」を使う）
  // GPSの精度（誤差）が大きいときは、位置のブレによる誤反応を避けるため判定に使わない。
  const gpsAccuracyOkForForgot = (state.pos.accuracy == null) || (state.pos.accuracy <= 30);
  const effectiveArriveDistForForgot = (target.customArriveDist != null) ? target.customArriveDist : state.settings.arriveDist;
  if(gpsAccuracyOkForForgot && atr.minDist <= effectiveArriveDistForForgot && dist > atr.minDist + state.settings.forgotReminderDist){
    const wasCompleted = state.progress.done.includes(target.id);
    if(!wasCompleted && state.forgotReminderShownFor !== target.id){
      state.forgotReminderShownFor = target.id; // 同じ地点で何度も出さないよう記録する
      state.forgotReminderPending = target.id;
      render();
    }
  }

  const distNum = document.getElementById('distNum');
  const dirText = document.getElementById('dirText');
  if(distNum){
    distNum.textContent = dist >= 1000 ? (dist/1000).toFixed(1) : dist;
    document.querySelector('.dist-row .unit').textContent = dist >= 1000 ? 'km' : 'm';
  }
  if(dirText) dirText.textContent = compassText(brg) + '方向';
  const w = document.getElementById('gpsWarn');
  if(w) w.style.display = 'none';

  // GPSは取得できているが精度（誤差）が大きい＝信号が弱いと考えられる場合に知らせる
  const weakWarnEl = document.getElementById('gpsWeakWarn');
  if(weakWarnEl){
    const acc = state.pos.accuracy;
    if(acc != null && acc > 50){
      weakWarnEl.style.display = 'block';
      weakWarnEl.textContent = `📶 GPS信号が弱くなっています（誤差 約${Math.round(acc)}m）。建物や山などが原因の場合があります。`;
    } else {
      weakWarnEl.style.display = 'none';
    }
  }

  // 目的地に近づくにつれて地図の縮尺を自動的に大きくする（段階が変わったときだけ動かす）
  updateProximityZoom(dist, target);

  // 「現在地に戻る」ボタンを押した後（追従モード中）は、動くたびに自動で現在地へ合わせ続ける
  if(state.followMode && !state.manualPan && state.miniMap){
    try{
      state.__programmaticZoom = true;
      const centerPt = [state.pos.lat, state.pos.lng];
      state.miniMap.panTo(centerPt, {animate:true});
      setTimeout(()=>{ state.__programmaticZoom = false; }, 50);
    }catch(e){}
  }

  const key = target.id;
  const st = state.announced[key];
  const effectiveArriveDist = (target.customArriveDist != null) ? target.customArriveDist : state.settings.arriveDist;
  let debugSpeedOk = null, debugHeldMs = null; // 診断表示用（下のupdateDebugPanelで使う）

  // 直前に自動完了した地点からまだ動いていない場合は、同じ場所で次の地点まで
  // 連続で自動完了になってしまわないよう、動くまでは自動判定そのものを止める
  // （手動で「配達完了」ボタンを押すことはできる）
  const AUTO_COMPLETE_MOVE_THRESHOLD = 10; // メートル。これだけ動いたら自動判定を再開する
  if(state.autoCompleteBlockedPos){
    const movedFromLast = haversine(state.pos.lat, state.pos.lng, state.autoCompleteBlockedPos.lat, state.autoCompleteBlockedPos.lng);
    if(movedFromLast >= AUTO_COMPLETE_MOVE_THRESHOLD){
      state.autoCompleteBlockedPos = null; // 十分に動いたので自動判定を再開する
    }
  }

  if(dist <= effectiveArriveDist && !state.autoCompleteBlockedPos){
    // 距離だけでなく、GPSの移動速度が設定値（初期値5km/h）以下になるまでは配達完了にしない
    const speedOk = (state.pos.speedKmh == null) || (state.pos.speedKmh <= state.settings.stopSpeedKmh);
    debugSpeedOk = speedOk;
    if(speedOk){
      // 「距離・速度の条件を満たした瞬間」ではなく、その状態が1秒間続いて初めて
      // 到着とみなす（一瞬の減速やGPSのブレで早まって完了にならないようにするため）
      const ARRIVAL_HOLD_MS = 1000;
      // GPSの誤差で、条件が一瞬だけ途切れる（距離がわずかに外に出る／速度が一瞬跳ねる）
      // ことがある。その一瞬だけでカウントを最初からやり直してしまうと、電波の弱い場所では
      // いつまで経っても1秒間が連続で成立せず、「信号は緑なのに次の地点に進まない」原因になる。
      // そこで、条件が満たされなくなってもすぐには経過時間を捨てず、
      // HOLD_GRACE_MS以内に条件を満たす状態へ戻れば、カウントを継続させる。
      const HOLD_GRACE_MS = 1500;
      const tracker = state.arrivalHoldTracking[key];
      if(!tracker){
        state.arrivalHoldTracking[key] = {since: Date.now(), lastOk: Date.now()};
      } else {
        tracker.lastOk = Date.now(); // 条件を満たした瞬間を記録するが、sinceは変えず経過時間を維持する
      }
      const heldMs = Date.now() - state.arrivalHoldTracking[key].since;
      debugHeldMs = heldMs;
      if(st !== 'arrived' && heldMs >= ARRIVAL_HOLD_MS){
        state.announced[key] = 'arrived';
        if(state.settings.autoComplete){
          speak(`${target.name}、配達先に到着しました。`);
          toast('到着（自動）：' + (target.name||''));
          state.autoCompleteBlockedPos = {lat: state.pos.lat, lng: state.pos.lng}; // 次の自動判定は動くまで止める
          autoCompleteById(target.id);
          return; // render()の中で改めてmini map等を作り直すため、ここで終了
        } else {
          speak(`到着しました。${target.name}です。${target.memo || ''}`);
        }
      }
    } else {
      clearArrivalHoldIfGraceExpired(key); // 速度条件が途切れた。猶予時間を超えていれば本当にリセットする
    }
    // 距離的には到着圏内でも、まだ速度が速い（停止していない）場合は次の更新まで待つ
  } else if(dist <= state.settings.announceDist){
    clearArrivalHoldIfGraceExpired(key); // 到着圏外に出た。猶予時間を超えていれば本当にリセットする
    if(!st){
      speak(`まもなくです。次は${target.name}、あと${dist}メートルです。`);
      state.announced[key] = 'near';
    }
  }

  if(state.debugPanelOn){
    updateDebugPanel({
      lat: state.pos.lat, lng: state.pos.lng, accuracy: state.pos.accuracy, speedKmh: state.pos.speedKmh,
      targetName: target.name, targetLat: target.lat, targetLng: target.lng,
      dist, effectiveArriveDist, withinDist: dist <= effectiveArriveDist,
      speedOk: debugSpeedOk, heldMs: debugHeldMs,
      announced: state.announced[key] || '(なし)',
      autoCompleteBlockedPos: !!state.autoCompleteBlockedPos
    });
  }

  // ナビ画面を開いている間は、操作不要で自動的にログを記録し続ける（📤ボタンで送信できる）
  state.navLog.push({
    t: Date.now(), targetId: target.id, targetName: target.name,
    lat: state.pos.lat, lng: state.pos.lng, accuracy: state.pos.accuracy, speedKmh: state.pos.speedKmh,
    dist, effectiveArriveDist, withinDist: dist <= effectiveArriveDist,
    speedOk: debugSpeedOk, heldMs: debugHeldMs,
    announced: state.announced[key] || '',
    blocked: !!state.autoCompleteBlockedPos
  });
  if(state.navLog.length > 5000) state.navLog.shift(); // 記録が際限なく増えないよう、古いものから捨てる

  updateMiniMap(target);
}

// 到着判定の1秒カウント用トラッカーを、条件が途切れてもすぐには消さず、
// 直近に条件を満たしていた時刻からHOLD_GRACE_MS以内であれば残しておく
// （一瞬のGPSのブレでカウントが仕切り直しにならないようにするため）。
function clearArrivalHoldIfGraceExpired(key){
  const HOLD_GRACE_MS = 1500;
  const tracker = state.arrivalHoldTracking[key];
  if(!tracker) return;
  const sinceLastOk = Date.now() - tracker.lastOk;
  if(sinceLastOk > HOLD_GRACE_MS){
    delete state.arrivalHoldTracking[key];
  }
}

async function autoCompleteById(id){
  if(state.progress.done.includes(id)) return;
  state.progress.done.push(id);
  state.progress.doneMeta[id] = buildDoneMeta(id, 'auto');
  clearPassedFlag(id);
  await storeSet('progress', state.progress);
  state.followMode = true; resumeRotationForFollow(); // 次の配達先に移るので、現在地への追従を自動的に再開する

  // 画面を更新（GPS watchは張り直さず維持したいが、対象カードやミニマップが総入れ替えになるため再構築する）
  render();
  startWatch();
}

async function forgotReminderComplete(){
  const id = state.forgotReminderPending;
  state.forgotReminderPending = null;
  if(id && !state.progress.done.includes(id)){
    state.progress.done.push(id);
    state.progress.doneMeta[id] = buildDoneMeta(id, 'manual');
    clearPassedFlag(id);
    await storeSet('progress', state.progress);
    state.followMode = true; resumeRotationForFollow();
  }
  render();
  startWatch();
}
function forgotReminderSkip(){
  const id = state.forgotReminderPending;
  state.forgotReminderPending = null;
  if(id){
    const idx = state.routeOrder.indexOf(id);
    if(idx >= 0){
      state.routeOrder.splice(idx, 1);
      state.routeOrder.push(id);
    }
  }
  render();
  startWatch();
}
function forgotReminderDismiss(){
  state.forgotReminderPending = null;
  render();
}

function meMarkerIcon(headingDeg){
  return L.divIcon({
    className:'',
    html:`<div class="me-arrow" style="transform:rotate(${headingDeg}deg)"></div>`,
    iconSize:[44,44], iconAnchor:[22,22]
  });
}
function updateMiniMap(target){
  if(!state.miniMap) return;
  const pointLabels = buildPointNumberLabels();
  try{
    if(state.pos){
      // 地図の回転（ヘディングアップ）と同じ向きの情報源を使う。
      // ヘディングアップONのときは、地図側が -heading 回転しているので、
      // 矢印側は +heading 回転させることで打ち消し合い、常に画面の真上を指すようになる
      // （ナビアプリの一般的な挙動）。ノースヘッドのときは地図が回転していないので、
      // 矢印がそのまま実際の向きを示す。
      const heading = getDisplayHeading() != null ? getDisplayHeading() : (state.movementHeading != null ? state.movementHeading : 0);
      if(!state.meMarker){
        state.meMarker = L.marker([state.pos.lat, state.pos.lng], {icon: meMarkerIcon(heading), interactive:false}).addTo(state.miniMap);
        state.meMarkerHeading = heading;
      } else {
        state.meMarker.setLatLng([state.pos.lat, state.pos.lng]);
        if(state.meMarkerHeading !== heading){
          state.meMarker.setIcon(meMarkerIcon(heading));
          state.meMarkerHeading = heading;
        }
      }
    }
    // 現在の目標に「到着したか（配達完了ボタンを押す前でも、近づいたら）」で見た目を切り替える
    // 到着前：赤い点滅のレーダー波紋／到着後：緑の点滅レーダー波紋（まだ配達完了を押していない場合）
    if(!target){
      // 全件配達完了後など、目的地が無い場合は、目的地用のマーカー・案内線が
      // 残っていれば片付けるだけにする（自分の位置マーカーは上ですでに更新済み）
      if(state.targetMarker){ try{ state.miniMap.removeLayer(state.targetMarker); }catch(e){} state.targetMarker = null; state.targetMarkerArrived = null; }
      if(state.directionLine){ try{ state.miniMap.removeLayer(state.directionLine); }catch(e){} state.directionLine = null; }
      return;
    }
    const effectiveArriveDist = (target.customArriveDist != null) ? target.customArriveDist : state.settings.arriveDist;
    const distToTarget = state.pos ? haversine(state.pos.lat, state.pos.lng, target.lat, target.lng) : Infinity;
    const hasArrivedAtTarget = distToTarget <= effectiveArriveDist || state.announced[target.id] === 'arrived';
    const targetShape = getSpecialShape(target);
    const targetShapeSize = shapeSize(targetShape, 42);
    const targetShapeColor = pinColor(target.pinType); // 目的地になっても、登録した色をそのまま使う（以前は赤に固定していた）
    const targetIconHtml = hasArrivedAtTarget
      ? `<div class="arrived-target-pin"><div class="radar-ring"></div><div class="radar-dot"></div></div>`
      : (targetShape
          ? `<div class="${shapeCssClass(targetShape)}" style="background:${targetShapeColor};width:${targetShapeSize}px;height:${targetShapeSize}px;box-shadow:0 0 10px 3px ${targetShapeColor}b3;animation:selected-pin-blink 1s ease-in-out infinite;"></div>`
          : `<div class="current-target-pin"><div class="radar-ring"></div><div class="radar-dot"></div></div>`);
    const targetIconSize = hasArrivedAtTarget ? [52,52] : (targetShape ? [shapeSize(targetShape,34),shapeSize(targetShape,34)] : [52,52]);
    const targetIconAnchor = hasArrivedAtTarget ? [26,26] : (targetShape ? [shapeSize(targetShape,34)/2,shapeSize(targetShape,34)/2] : [26,26]);

    if(!state.targetMarker){
      state.targetMarker = L.marker([target.lat, target.lng], {
        icon: L.divIcon({className:'', html: targetIconHtml, iconSize: targetIconSize, iconAnchor: targetIconAnchor})
      }).addTo(state.miniMap);
      state.targetMarkerArrived = hasArrivedAtTarget;
      if(hasArrivedAtTarget) showArrivalBanner(`${target.name}\nに到着しました`, 20000);
    } else {
      state.targetMarker.setLatLng([target.lat, target.lng]);
      if(state.targetMarkerArrived !== hasArrivedAtTarget){
        state.targetMarker.setIcon(L.divIcon({className:'', html: targetIconHtml, iconSize: targetIconSize, iconAnchor: targetIconAnchor}));
        if(hasArrivedAtTarget) showArrivalBanner(`${target.name}\nに到着しました`, 20000); // 未到着→到着に切り替わった瞬間だけ表示する
        state.targetMarkerArrived = hasArrivedAtTarget;
      }
    }
    try{
      state.targetMarker.unbindTooltip();
      const targetNumText = pointLabels[target.id];
      if(targetNumText) state.targetMarker.bindTooltip(targetNumText, {permanent:true, direction:'right', offset:[16,0], className:'point-num-label point-num-label-target'});
    }catch(e){}

    // 現在地から次の配達地点への方向が一目で分かるよう、点線でつなぐ
    if(state.pos){
      const linePoints = [[state.pos.lat, state.pos.lng], [target.lat, target.lng]];
      if(!state.directionLine){
        state.directionLine = L.polyline(linePoints, {color:'#ff0000', weight:3, opacity:1, interactive:false}).addTo(state.miniMap);
      } else {
        state.directionLine.setLatLngs(linePoints);
      }
    }
    // 現在地・対象地点のマーカー位置だけを更新し、地図の表示位置（スクロール・ズーム）は
    // 自動では動かさない。地図を戻すのは「現在地に戻る」ボタンが押されたときだけ。
  }catch(e){ }
}

function updateRecenterBtnState(){
  const btn = document.querySelector('.recenter-btn');
  if(!btn) return;
  // 「手動操作中」または「追従が止まっている」ときは、ボタンの見た目で分かるようにする
  btn.classList.toggle('active-pan', !!state.manualPan || !state.followMode);
}

function recenterMiniMap(){
  if(!state.miniMap) return;
  const target = byId(currentTargetId());
  if(!target){
    // 全件配達完了後（次の目的地が無い）は、目的地との距離に合わせる必要が無いので、
    // 縮尺はそのまま変えず、自分の位置だけを画面中央に合わせる
    if(!state.pos) return;
    try{
      state.__programmaticZoom = true;
      const centerPt = [state.pos.lat, state.pos.lng];
      state.miniMap.panTo(centerPt, {animate:true});
      setTimeout(()=>{ state.__programmaticZoom = false; }, 50);
      state.manualPan = false;
      state.followMode = true; resumeRotationForFollow();
      continuousRotationReady = false;
      updateRecenterBtnState();
    }catch(e){}
    return;
  }
  try{
    state.__programmaticZoom = true;
    if(state.settings.zoomLocked){
      // 縮尺は配達員が調整した値のまま固定し、位置（中心）だけを合わせる
      const centerPt = state.pos ? [state.pos.lat, state.pos.lng] : [target.lat, target.lng];
      state.miniMap.panTo(centerPt, {animate:true});
    } else {
      const bounds = state.pos
        ? L.latLngBounds([[state.pos.lat,state.pos.lng],[target.lat,target.lng]])
        : L.latLngBounds([[target.lat,target.lng]]);
      // 下部の暗いカードで隠れる分、下側の余白を多めに取ることで見える範囲の中心に合わせる
      state.miniMap.fitBounds(bounds, {
        paddingTopLeft:[40,40],
        paddingBottomRight:[40, 40 + getBottomCardOffsetPx()*2],
        maxZoom:15
      });
      // fitBoundsで実際のズームが変わるため、次のGPS更新で確実に距離に応じたズームへ
      // 補正されるよう、内部トラッキングをリセットしておく
      state.lastAutoZoomTier = null;
      state.lastAutoZoomTargetId = null;
    }
    setTimeout(()=>{ state.__programmaticZoom = false; }, 50);
    // 手動で地図を動かしていた場合も、ボタンを押したら自動追従・自動回転を再開する
    // （縮尺の固定＝zoomLockedはこのボタンでは解除しない。配達員が選んだ縮尺を尊重する）
    state.manualPan = false;
    state.followMode = true; resumeRotationForFollow(); // このボタンを押した後は、動くたびに自動で現在地へ追従する
    continuousRotationReady = false; // 次のコンパス値から回転をやり直す
    updateRecenterBtnState();
  }catch(e){}
}
function navZoomIn(){
  if(!state.miniMap) return;
  try{
    state.settings.zoomLocked = true; // 手動でズームしたので、以後は自動ズームを行わない
    state.__programmaticZoom = true;
    state.miniMap.zoomIn();
    setTimeout(()=>{
      state.settings.lockedZoomLevel = state.miniMap.getZoom();
      storeSet('settings', state.settings);
      state.__programmaticZoom = false;
    }, 300);
  }catch(e){}
}
function navZoomOut(){
  if(!state.miniMap) return;
  try{
    state.settings.zoomLocked = true;
    state.__programmaticZoom = true;
    state.miniMap.zoomOut();
    setTimeout(()=>{
      state.settings.lockedZoomLevel = state.miniMap.getZoom();
      storeSet('settings', state.settings);
      state.__programmaticZoom = false;
    }, 300);
  }catch(e){}
}
function centerOnTarget(){
  // 「次の配達地表示」：現在の目的地（黄色のピン）だけを地図の中心に持ってくる。
  // 現在地とは違い、縮尺は変えずに中心（パン）だけ動かす。
  if(!state.miniMap) return;
  const target = byId(currentTargetId());
  if(!target) return;
  try{
    // 追従モード（GPS更新のたびに現在地へ戻る）が有効なままだと、
    // このボタンで目的地を表示した直後に現在地へ引き戻されてしまうため、一旦止める。
    // 「現在地に戻る」ボタンを押せば、追従モードはまた再開できる。
    state.followMode = false;
    updateRecenterBtnState();
    if(!state.settings.headingUp){
      // 「進行方向を上」がOFFのとき（＝北が上のとき）だけ、確実に北向きにしておく
      snapToNorthUpForInspection();
    }
    // 「進行方向を上」がONのときは、その向きのまま次の配達地を確認できるようにする
    state.__programmaticZoom = true;
    const centerPt = adjustCenterForBottomCard([target.lat, target.lng]);
    state.miniMap.panTo(centerPt, {animate:true});
    // アニメーションの完了（moveend）を待たず、即座に表示位置を覚えておく。
    // こうしないと、アニメーション中に地図が作り直された場合、古い位置に戻ってしまう。
    try{ state.miniMapView = {center: centerPt, zoom: state.miniMap.getZoom()}; }catch(e){}
    setTimeout(()=>{ state.__programmaticZoom = false; }, 50);
  }catch(e){}
}

function initMiniMap(){
  const el = document.getElementById('miniMap');
  if(!el || typeof L==='undefined') return;
  // 現在地確認画面（配達とは無関係）では、目的地・他の配達地点は一切意識しない
  const isCheckLoc = state.view === 'checkloc';
  const targetId = isCheckLoc ? null : currentTargetId();
  const target = isCheckLoc ? null : byId(targetId);
  const remainingIds = isCheckLoc ? [] : remainingRoute();
  const nextId = isCheckLoc ? null : (remainingIds.find(id=>id!==targetId) || null);
  const pointLabels = isCheckLoc ? {} : buildPointNumberLabels();

  if(state.miniMap){
    try{ state.miniMapView = {center: state.miniMap.getCenter(), zoom: state.miniMap.getZoom()}; }catch(e){}
    try{ state.miniMap.remove(); }catch(e){}
    state.miniMap = null;
  }
  // 地図そのものを作り直すときは、前の地図に紐づいていたマーカーの参照はもう無効なので、
  // 必ずゼロから作り直す（そうしないと新しい地図にピンが1つも表示されないままになる）
  state.otherPointMarkers = [];
  state.otherMarkersSignature = null;

  const center = target ? [target.lat,target.lng] : [35.397,132.751];
  const initialZoom = (state.settings.zoomLocked && state.settings.lockedZoomLevel) ? state.settings.lockedZoomLevel : 15;
  state.miniMap = L.map('miniMap', {zoomControl:false, attributionControl:false, preferCanvas:true, maxZoom:21}).setView(center, initialZoom);
  syncMiniMapTransformOrigin(); // #miniMap要素が新しく作り直されるたびに、回転軸を今のカード高さに合わせ直す

  // 目的地が変わるたびに render() で#miniMap要素自体が新しく作り直されるため、
  // 何もしないと回転角が一瞬0度に戻り、そこから正しい角度まで1.2秒かけて
  // アニメーションしてしまう（＝「ぐるっと回転する」ように見える）。
  // これを防ぐため、新しい要素にはアニメーション無しで前回の角度を即座に反映する。
  if(continuousRotationReady && state.settings.headingUp){
    el.style.transition = 'none';
    el.style.transform = `translate(-50%,-50%) rotate(${continuousRotation}deg)`;
    el.offsetHeight; // 強制的に反映させる（reflow）
    el.style.transition = 'transform 1.67s ease-in-out';
  }

  try{
    state.miniMap.on('dragstart', ()=>{
      // 🎯ボタンなどで意図的に追従をOFFにしていた場合、ズーム操作のついでに
      // それを勝手にONへ戻してしまわないよう、ドラッグ直前の状態を覚えておく
      state.followModeBeforeDrag = state.followMode;
      state.manualPan = true;
      state.followMode = false; // 手で動かしたら自動追従は止める（次にボタンを押すまで）
      updateRecenterBtnState();
      if(!state.settings.headingUp){
        // 「進行方向を上」がOFFのとき（＝北が上のとき）だけ、確実に北向きにしておく
        snapToNorthUpForInspection();
      }
      // 「進行方向を上」がONのときは、その向きのままドラッグできるようにする（①と統一）
    });
    // 配達員ごとに見やすい縮尺の好みがあるため、一度でも手動でズーム操作したら
    // 以後は自動ズームを行わず、その縮尺のまま固定する（次回以降も覚えておく）
    state.miniMap.on('zoomstart', ()=>{
      if(!state.__programmaticZoom) state.settings.zoomLocked = true;
    });
    state.miniMap.on('zoomend', ()=>{
      if(state.settings.zoomLocked && !state.__programmaticZoom){
        state.settings.lockedZoomLevel = state.miniMap.getZoom();
        storeSet('settings', state.settings);
      }
      // 拡大・縮小の操作（ピンチ操作時に指が少し動いて誤ってドラッグ扱いになった場合も含む）
      // が終わったら、手動操作中のフラグは解除する。
      // ただし追従（followMode）は、🎯ボタンなどで意図的にOFFにしていた場合は
      // ズームのついでに勝手にONへ戻さない（ドラッグ直前がONだった場合だけ再開する）
      if(!state.__programmaticZoom){
        state.manualPan = false;
        if(state.followModeBeforeDrag !== false){
          state.followMode = true;
          resumeRotationForFollow();
        }
        updateRecenterBtnState();
      }
    });
    // 現在の表示位置を常に覚えておく（🎯で目的地を表示した後などに、何かの拍子に
    // 地図が作り直されても、古い位置（現在地寄りなど）に戻ってしまわないようにするため）
    state.miniMap.on('moveend', ()=>{
      try{ state.miniMapView = {center: state.miniMap.getCenter(), zoom: state.miniMap.getZoom()}; }catch(e){}
    });
  }catch(e){}
  try{
    createOfflineCapableTileLayer().addTo(state.miniMap);
  }catch(e){}

  // 編集画面で登録した「地図に無い建物」も、配達中の地図に表示する
  // （ルート線・ピンより下、タイルより上になるよう、ここで先に描いておく）
  try{ drawBuildingsOnPointsMap(); }catch(e){ logAppError('initMiniMap:drawBuildings', e); }

  state.navRouteLines = [];
  state.navRouteArrows = [];
  if(state.settings.showRouteLine){
    const DEFAULT_SEGMENT_COLOR = '#E24B4A'; // 他の関数と同じ既定色（この関数のスコープでも必要なため個別に定義）
    state.routeSegments.forEach((seg, segIdx)=>{
      if(seg.length < 2) return;
      try{
        const points = buildRoutePoints(seg);
        const segColor = state.segmentColors[segIdx] || DEFAULT_SEGMENT_COLOR;
        const lineOutline = L.polyline(points, {color:'#000000', weight:7, opacity:0.75, smoothFactor:0.5}).addTo(state.miniMap);
        const line = L.polyline(points, {color:segColor, weight:3.5, opacity:0.9, smoothFactor:0.5}).addTo(state.miniMap);
        state.navRouteLines.push(lineOutline, line);
      }catch(e){}
    });
  }

  // 次の目的地は専用のマーカーで区別して表示する
  state.nextTargetMarker = null;
  if(nextId){
    const nm = byId(nextId);
    if(nm){
      try{
        const nextShape = getSpecialShape(nm);
        // V50.7：形のある地点は、次の目的地になっても登録した色・形のまま表示する（以前は色に関係なく赤い丸＋白い記号だった）。
        // 他の地点より大きくし、白いふちを付けて「次」と分かるようにする。形の無い地点は今まで通りの赤い丸。
        const nextSize = nextShape ? shapeSize(nextShape, 32) : 32;
        const nextHtml = nextShape
          ? `<div style="filter:drop-shadow(0 0 2px #fff) drop-shadow(0 0 2px #fff) drop-shadow(0 2px 4px rgba(0,0,0,0.6));"><div class="${shapeCssClass(nextShape)}" style="background:${nm.isLandmark ? '#8a94ab' : pinColor(nm.pinType)};width:${nextSize}px;height:${nextSize}px;box-shadow:none;"></div></div>`
          : `<div class="next-target-pin"${(!nm.isLandmark && nm.pinType && nm.pinType!=='default') ? ` style="background:${pinColor(nm.pinType)}"` : ''}></div>`; // V50.8：色が「標準」以外なら、その色の丸
        state.nextTargetMarker = L.marker([nm.lat, nm.lng], {
          icon: L.divIcon({className:'', html:nextHtml, iconSize:[nextSize,nextSize], iconAnchor:[nextSize/2,nextSize/2]}),
          interactive:false
        }).addTo(state.miniMap);
        const nextNumText = pointLabels[nm.id];
        if(nextNumText) state.nextTargetMarker.bindTooltip(nextNumText, {permanent:true, direction:'right', offset:[16,0], className:'point-num-label'});
      }catch(e){}
    }
  }

  // 配達完了した地点は、配達員がまだ近くにいる間は「到着直後」のオレンジのマーカーで、
  // そこから一定距離（NEARBY_DONE_RADIUS）離れたら青色の円に切り替えて表示する
  state.lastCompletedMarker = null;
  const NEARBY_DONE_RADIUS = 5; // メートル。この距離を超えて離れたら青に変わる

  // 現在の対象・次の対象以外を、参考として表示する
  // （配達済みは距離に応じてオレンジ／青、未配達はマジェンタの塗りつぶし、目印は灰色）

  // GPSが更新されるたびに243件などすべてのピンを毎回作り直すと重くなるため、
  // 「見た目に影響しそうな条件」が前回から変わっていないときは再構築をスキップする。
  // 位置は5m四方の格子に丸め、GPSの小さなブレだけでは再構築しないようにする。
  const posGridLat = state.pos ? Math.round(state.pos.lat / 0.00005) : 0;
  const posGridLng = state.pos ? Math.round(state.pos.lng / 0.00005) : 0;
  const othersSignature = JSON.stringify({
    done: state.progress.done.slice().sort(),
    target: target ? target.id : null,
    next: nextId,
    pos: [posGridLat, posGridLng]
  });

  if(state.otherMarkersSignature !== othersSignature || !state.otherPointMarkers.length){
    state.otherMarkersSignature = othersSignature;
    // 前回作ったマーカーが残っていれば、地図から確実に取り除いてから作り直す
    state.otherPointMarkers.forEach(mk=>{ try{ state.miniMap.removeLayer(mk); }catch(e){} });
    state.otherPointMarkers = [];
    try{
    const doneSet = new Set(state.progress.done);
    const DELIVERY_MAGENTA = '#e619c9';
    const DELIVERY_DONE_BLUE = '#1e6fff';
    state.markers.forEach(m=>{
      if(m.isHidden) return; // 「非表示」に設定された地点は、配達画面の地図にも一切出さない
      if(target && m.id===target.id) return;
      if(nextId && m.id===nextId) return;
      const isDone = doneSet.has(m.id);
      const pointShape = getSpecialShape(m);

      if(!m.isLandmark && isDone){
        // ピンの座標ではなく「完了した瞬間に自分がいた位置」からの距離で判定する。
        // （ピンの座標が実際の立ち位置から離れていると、完了した瞬間にいきなり
        // 青色になってしまうことがあるため。古いデータ（位置情報が無いもの）は
        // これまで通りピンの座標を使う）
        const doneMetaEntry = state.progress.doneMeta[m.id];
        const refPos = (doneMetaEntry && doneMetaEntry.pos) ? doneMetaEntry.pos : {lat: m.lat, lng: m.lng};
        const distFromMe = state.pos ? haversine(state.pos.lat, state.pos.lng, refPos.lat, refPos.lng) : Infinity;
        if(distFromMe <= NEARBY_DONE_RADIUS){
          // まだ近くにいる＝到着直後のマーカー
          try{
            const mk = L.marker([m.lat, m.lng], {
              icon: L.divIcon({className:'', html:`<div class="${pointShape?shapeCssClass(pointShape):'just-arrived-pin'}" style="${pointShape?`background:#FAC775;width:${shapeSize(pointShape,28)}px;height:${shapeSize(pointShape,28)}px;`:''}"></div>`, iconSize: pointShape?[shapeSize(pointShape,28),shapeSize(pointShape,28)]:[26,26], iconAnchor: pointShape?[shapeSize(pointShape,28)/2,shapeSize(pointShape,28)/2]:[13,13]}),
              interactive:false
            }).addTo(state.miniMap);
            const numText = pointLabels[m.id];
            if(numText) mk.bindTooltip(numText, {permanent:true, direction:'right', offset:[10,0], className:'point-num-label'});
            state.otherPointMarkers.push(mk);
          }catch(e){}
          return;
        }
        // 離れた＝青色（形の指定があれば青いその形）
        if(pointShape){
          const mk = L.marker([m.lat, m.lng], {
            icon: L.divIcon({className:'', html:`<div class="${shapeCssClass(pointShape)}" style="background:${DELIVERY_DONE_BLUE};width:${shapeSize(pointShape,24)}px;height:${shapeSize(pointShape,24)}px;"></div>`, iconSize:[shapeSize(pointShape,24),shapeSize(pointShape,24)], iconAnchor:[shapeSize(pointShape,24)/2,shapeSize(pointShape,24)/2]}),
            interactive:false
          }).addTo(state.miniMap);
          const numTextDoneStar = pointLabels[m.id];
          if(numTextDoneStar) mk.bindTooltip(numTextDoneStar, {permanent:true, direction:'right', offset:[9,0], className:'point-num-label'});
          state.otherPointMarkers.push(mk);
          return;
        }
        const dot = L.circleMarker([m.lat, m.lng], {
          radius:7.5, weight:1.5, color:DELIVERY_DONE_BLUE, fillColor:DELIVERY_DONE_BLUE, fillOpacity:0.9, interactive:false
        }).addTo(state.miniMap);
        const numTextDone = pointLabels[m.id];
        if(numTextDone) dot.bindTooltip(numTextDone, {permanent:true, direction:'right', offset:[8,0], className:'point-num-label'});
        state.otherPointMarkers.push(dot);
        return;
      }

      // 形のついた地点は、登録した色をそのまま使う（以前は形があると全て統一マゼンタにしていた）。
      // 目印（ランドマーク）だけは今まで通り灰色、形が無い普通の地点は今まで通りマゼンタのまま。
      const color = m.isLandmark ? '#8a94ab' : ((pointShape || (m.pinType && m.pinType!=='default')) ? pinColor(m.pinType) : DELIVERY_MAGENTA); // V50.8：形の無い地点も、色を「標準」以外にしていればその色（標準は配達済みの青と紛れるので今まで通りマゼンタ）
      // 配達条件があり、今日は対象外の地点は、地図上でも薄く表示して一目で分かるようにする
      const condDimmed = m.condEnabled && !isDeliverableToday(m);
      if(pointShape){
        // 形の指定がある地点はその形で表示する（目印なら灰色・少し大きめ、それ以外は登録した色）
        const markSize = shapeSize(pointShape, 24);
        const mk = L.marker([m.lat, m.lng], {
          icon: L.divIcon({className:'', html:`<div class="${shapeCssClass(pointShape)}" style="background:${color};width:${markSize}px;height:${markSize}px;${condDimmed ? 'opacity:0.35;' : ''}"></div>`, iconSize:[markSize,markSize], iconAnchor:[markSize/2,markSize/2]}),
          interactive:false
        }).addTo(state.miniMap);
        const numTextUndoneStar = pointLabels[m.id];
        if(numTextUndoneStar) mk.bindTooltip(numTextUndoneStar, {permanent:true, direction:'right', offset:[9,0], className:'point-num-label'});
        state.otherPointMarkers.push(mk);
        return;
      }
      const dot = L.circleMarker([m.lat, m.lng], {
        radius: 7.5,
        weight: 1.5,
        color, fillColor: color,
        fillOpacity: condDimmed ? 0.25 : (m.isLandmark ? 0.4 : 0.9),
        opacity: condDimmed ? 0.35 : 1,
        interactive:false
      }).addTo(state.miniMap);
      if(!m.isLandmark){
        const numTextUndone = pointLabels[m.id];
        if(numTextUndone) dot.bindTooltip(numTextUndone, {permanent:true, direction:'right', offset:[8,0], className:'point-num-label'});
      }
      state.otherPointMarkers.push(dot);
    });
    }catch(e){}
  }

  state.meMarker = null;
  state.targetMarker = null;
  state.directionLine = null;
  state.trailLine = null;
  state.trailDotLayers = [];
  redrawFullTrail();
  if(target){
    updateMiniMap(target);
    if(state.miniMapView){
      // 途中の操作（配達完了・スキップなど）による再描画では、直前の表示位置を保つ
      state.miniMap.setView(state.miniMapView.center, state.miniMapView.zoom, {animate:false});
    } else {
      // ナビ画面を開いた最初の1回だけ、現在地・対象地点が見える位置に自動で合わせる
      recenterMiniMap();
    }
  } else {
    // 配達完了後（最終確認画面）：本日の軌跡・配達先全体が見えるように合わせる
    if(state.miniMapView){
      state.miniMap.setView(state.miniMapView.center, state.miniMapView.zoom, {animate:false});
    } else {
      fitDoneMapView();
    }
  }
}
function fitDoneMapView(){
  if(!state.miniMap) return;
  try{
    const allPts = [];
    (state.progress.trail||[]).forEach(p=>allPts.push([p.lat,p.lng]));
    state.markers.forEach(m=>allPts.push([m.lat,m.lng]));
    if(allPts.length){
      state.miniMap.fitBounds(L.latLngBounds(allPts), {padding:[30,30], maxZoom:17});
    }
  }catch(e){}
}

      <p class="help-p">うまく開かない場合は、「ファイル」アプリから該当ファイルを探して開く、または共有メニューから「ブラウザで開く」を選んでください。</p>
      <p class="help-p">より安定して使いたい場合は、このファイルをご自身のホームページ（例：Netlifyなど、https://で始まるサイト）にアップロードしてそこから開く方法もおすすめです。ブックマーク一つで開けるようになります。</p>
    </div>

    <div class="help-section">
      <div class="help-h">③ 位置情報（GPS）に関する重要な注意</div>
      <p class="help-p warn-text">⚠ メールの添付ファイルなどから直接開いた場合（file://）、スマホのブラウザによっては、セキュリティ上の理由で位置情報（現在地）が正しく取得できないことがあります。これはこのアプリ特有の問題ではなく、ブラウザ全般の仕様によるものです。</p>
      <p class="help-p">初めて使う前に、必ず「配達を開始する」を開いて、現在地からの距離が正しく表示されるか確認してください。うまく動かない場合は、ホームページ（https://）にアップロードして開くと解決することが多いです。</p>
      <p class="help-p">位置情報がうまく取得できないときは、画面に赤い注意文が表示されます。その場合は手動で「配達完了」ボタンを押して進めることもできます。</p>

      <div class="help-h help-h-click" style="margin-top:14px;padding-top:14px;border-top:1px solid var(--line);" onclick="toggleGpsHelp()">
        <span>🔧 GPSが使えない場合の対処方法</span>
        <span class="help-toggle-arrow">${state.gpsHelpExpanded ? '▲' : '▼'}</span>
      </div>
      ${state.gpsHelpExpanded ? `
      <div style="margin-top:10px;">
      <p class="help-p">「位置情報を取得できません」の後ろに続く英語の内容によって、対処方法が変わります。</p>
      <p class="help-p"><b>「User denied Geolocation」（拒否された）の場合</b><br>
      過去にこのサイトへの位置情報を「ブロック」した記録が残っています。一度ブロックされると、次回以降ポップアップ自体が出なくなります。<br>
      ①アドレスバー左側の鍵マーク（またはⓘマーク）をタップ →「権限」または「サイトの設定」→「位置情報」を「許可」に変更<br>
      ②見つからない場合は、Chromeの「⋮」→「設定」→「サイトの設定」→「位置情報」→ブロック中の一覧からこのサイトを探して「許可」に変更、またはクリア（削除）してから開き直す</p>

      屋内や建物の陰にいると起こりやすい、最も多い原因です。空が見える屋外で、数十秒待ってからもう一度「配達を開始する」を開き直してください。</p>

      機内モードがONになっていないか、スマホ本体の「位置情報サービス」がOFFになっていないか確認してください（設定アプリの上の方にあることが多いです）。</p>
      <p class="help-p"><b>何も表示されず「位置情報取得中…」のまま動かない場合</b><br>
      上記の①②を試したうえで直らない場合は、一度サイトのデータ（Cookieとキャッシュ）を完全に削除してから開き直してください。初めて開いたときと同じように、許可のポップアップが新しく出てくるはずです。</p>
      </div>
      ` : ''}
    </div>

    <div class="help-section">
      <div class="help-h">④ データの引き継ぎについて</div>
      <p class="help-p">このアプリのデータ（配達先・ルート順・進捗など）は、開いている端末のブラウザだけに保存されます。Claudeやインターネット上のサーバーには送られません。</p>
      <p class="help-p">そのため、パソコンとスマホなど<b>別々の端末では自動的には同期されません</b>。「設定」画面の「データを書き出す」でファイルを作成し、そのファイルを別の端末に送って「データを読み込む」から読み込んでください。</p>
    </div>

    <div class="help-section">
      <div class="help-h">⑤ 地図の向き（ヘッドアップ表示）について</div>
      <p class="help-p warn-text">⚠ このシステムは、スマートフォンの地図アプリ（Googleマップなど）のように、方位を正確に検知して地図を回転させることはできません。スマホ内蔵の方位センサーを使う仕組みではなく、GPSの移動方向から向きを推定しているため、歩き始め・低速時・停止時などは向きがずれたり、不安定に感じることがあります。</p>
      <p class="help-p">「進行方向を上にする（ヘッドアップ）」表示で見づらい・向きが合わないと感じる場合は、常に北を上にした「ノースヘッド」表示に切り替えてお使いになることをおすすめします。</p>
    </div>

    <div class="help-section">
      <div class="help-h">⑥ 音声案内・自動完了について</div>
      <p class="help-p">設定した距離まで近づくと音声で知らせ、さらに近づく（初期値10m）と自動的に「配達完了」になります。この距離や、自動完了のON/OFFは「設定」画面から変更できます。</p>

      <p class="help-p">そのため、国土地理院側で地図が更新されても、保存済みのデータがある場所ではすぐには反映されないことがあります。最新の状態にしたい場合は、設定画面の「地図をあらかじめ保存する」をもう一度押して、保存し直してください。</p>
    </div>

    <div class="help-section">

async function exportNavLog(){
  const hasNavLog = state.navLog && state.navLog.length > 0;
  const hasErrorLog = state.errorLog && state.errorLog.length > 0;
  if(!hasNavLog && !hasErrorLog){ toast('まだ記録されたログがありません'); return; }

  const stamp = new Date().toISOString().slice(0,19).replace(/[:T]/g,'-');
  const files = [];

  if(hasNavLog){
    const header = `バージョン: ${APP_VERSION}\n時刻,目的地ID,目的地名,緯度,経度,精度m,速度kmh,距離m,到着圏内m,圏内か,速度条件クリア,継続時間ms,到着判定,足止め中\n`;
    const rows = state.navLog.map(r => [
      new Date(r.t).toLocaleString('ja-JP'),
      r.targetId, r.targetName,
      r.lat.toFixed(6), r.lng.toFixed(6),
      r.accuracy != null ? Math.round(r.accuracy) : '',
      r.speedKmh != null ? r.speedKmh.toFixed(1) : '',
      r.dist, r.effectiveArriveDist,
      r.withinDist ? '1' : '0',
      r.speedOk === null ? '' : (r.speedOk ? '1' : '0'),
      r.heldMs === null ? '' : Math.round(r.heldMs),
      r.announced,
      r.blocked ? '1' : '0'
    ].map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
    const csv = '\uFEFF' + header + rows; // Excelで文字化けしないようBOMを付ける
    files.push(new File([csv], `nav-log-${stamp}.csv`, {type:'text/csv'}));
  }

  if(hasErrorLog){
    const header = `バージョン: ${APP_VERSION}\n時刻,発生箇所,エラー内容,詳細\n`;
    const rows = state.errorLog.map(r => [
      new Date(r.t).toLocaleString('ja-JP'), r.context, r.message, r.stack
    ].map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
    const csv = '\uFEFF' + header + rows;
    files.push(new File([csv], `error-log-${stamp}.csv`, {type:'text/csv'}));
  }

  try{
    if(navigator.canShare && navigator.canShare({files})){
      await navigator.share({files, title:'配達ナビ 診断ログ', text: `${APP_VERSION}のログです`});
      return;
    }
  }catch(e){
    return; // 共有シートでキャンセルされた場合など。エラー扱いにしない
  }
  // LINE・メールへの直接共有に対応していない端末では、代わりにファイルとしてダウンロードする
  files.forEach(file => {
    const url = URL.createObjectURL(file);
    const a = document.createElement('a');
    a.href = url; a.download = file.name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 5000);
  });
  toast('ログをダウンロードしました');
}

/* ---- 「システムのみ」を書き出す（配達データを含まない、まっさらな状態のアプリ本体を渡すため） ----
   このファイル（アプリ本体）には、初回起動時の移行用データとして DEFAULT_MARKERS が
   埋め込まれている。これをそのまま人に渡すと、自分の配達先（お客様の氏名・住所・メモ）が
   一緒に渡ってしまうため、その部分だけを空にしたコピーを作って渡せるようにする。
   なお、現在端末に保存されている配達データ（各コースの地点・ルート等）はこの端末の
   ローカル保存領域にあるだけで、そもそもこのファイル自体には含まれていない。 */
function findMatchingBracketEnd(text, openIdx){
  // text[openIdx] は '[' である前提。対応する ']' の位置を、文字列中の "[" "]" は
  // 無視するように（クォート・エスケープを考慮して）数えながら探す。
  let depth = 0;
  let inString = null; // "'" か '"' のときだけ文字列中
  for(let i = openIdx; i < text.length; i++){
    const ch = text[i];
    if(inString){
      if(ch === '\\'){ i++; continue; } // エスケープの次の1文字は読み飛ばす
      if(ch === inString) inString = null;
      continue;
    }
    if(ch === '"' || ch === "'"){ inString = ch; continue; }
    if(ch === '[') depth++;
    else if(ch === ']'){
      depth--;
      if(depth === 0) return i;
    }
  }
  return -1; // 壊れている場合（見つからない）
}

async function exportBlankSystem(){
  if(!confirm('配達データを一切含まない「まっさらな状態」のアプリを書き出します。\n（今お使いのコース・配達先データはこの端末に残ります。渡す側には影響しません）\n\n⚠ 以前からこのアプリをお使いの方が、同じ端末・同じブラウザでこのファイルを開いた場合は、保存されている今までのコースが自動的に読み込まれます（このファイル自体は空でも、端末側に残ったデータを読みに行くためです）。\n\n初めて使う相手（別の端末・別のブラウザ）が開いた場合は、コースが入っていない空の状態になります。\n\n保存先：端末の「ダウンロード」フォルダ\n（iPhoneの場合は「ファイル」アプリ内）\n\nよろしいですか？')) return;

  toast('作成しています…', 2000);

  // まず、今表示中のページそのものの「元のソース」を取得する（DOMの現在の見た目ではなく、
  // 保存されているファイルの中身をそのまま使うのが一番確実なため）
  let html = null;
  try{
    const res = await fetch(location.href, {cache:'no-store'});
    if(res.ok){
      const text = await res.text();
      if(text.includes('DEFAULT_MARKERS')) html = text;
    }
  }catch(e){ /* file:// 等で取得できない端末もある。下の代替方法にフォールバックする */ }

  if(!html){
    // フォールバック：今のDOMから組み立てる。配達データの一覧画面などが開いたままだと
    // 見た目の情報まで含んでしまうため、アプリの表示部分（#app）は空にしてから書き出す
    const clone = document.documentElement.cloneNode(true);
    const appEl = clone.querySelector('#app');
    if(appEl) appEl.innerHTML = '';
    html = '<!DOCTYPE html>\n' + clone.outerHTML;
  }

  const marker = 'const DEFAULT_MARKERS = ';
  const startIdx = html.indexOf(marker);
  if(startIdx === -1){
    toast('⚠ システムデータの場所が見つかりませんでした。書き出しを中止しました', 4000);
    return;
  }
  const arrOpenIdx = startIdx + marker.length; // '[' の位置のはず
  if(html[arrOpenIdx] !== '['){
    toast('⚠ システムデータの形式が想定と違うため、書き出しを中止しました', 4000);
    return;
  }
  const arrCloseIdx = findMatchingBracketEnd(html, arrOpenIdx);
  if(arrCloseIdx === -1){
    toast('⚠ システムデータの終わりが見つからないため、書き出しを中止しました', 4000);
    return;
  }
  const blankHtml = html.slice(0, arrOpenIdx) + '[]' + html.slice(arrCloseIdx + 1);

  const stamp = new Date().toISOString().slice(0,10);
  const file = new File([blankHtml], `未配達防止プロ_システムのみ_${stamp}.html`, {type:'text/html'});

  // 保存場所を分かりやすくするため、共有シート（LINE・メール等）は使わず、常に
  // 端末の標準ダウンロード機能で保存する（Android・パソコン：「ダウンロード」フォルダ、
  // iPhone：「ファイル」アプリの「このiPhone内」→「ダウンロード」に保存される）
  const url = URL.createObjectURL(file);
  const a = document.createElement('a');
  a.href = url; a.download = file.name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 5000);
  toast('✓ 保存しました：「ダウンロード」フォルダ（iPhoneは「ファイル」アプリ内）\n' + file.name, 6000);
}
function startDebugPress(){
  const el = document.getElementById('gpsDebugInline');
  const btn = document.getElementById('debugBtn');
  if(!el) return;
  state.debugPanelOn = true;
  el.style.display = 'block';
  if(btn) btn.classList.add('nav-icon-on');
  if(state.pos) updateNavUI(); // 押した瞬間に最新の値へ更新する（次のGPS更新を待たない）
}
function endDebugPress(){
  const el = document.getElementById('gpsDebugInline');
  const btn = document.getElementById('debugBtn');
  state.debugPanelOn = false;
  if(el) el.style.display = 'none';
  if(btn) btn.classList.remove('nav-icon-on');
}
function updateDebugPanel(d){
  const el = document.getElementById('gpsDebugInline');
  if(!el) return;
  el.textContent =
`現在地: ${d.lat.toFixed(6)}, ${d.lng.toFixed(6)}（精度±${d.accuracy!=null?Math.round(d.accuracy):'?'}m）
速度: ${d.speedKmh!=null?d.speedKmh.toFixed(1)+'km/h':'(取得なし)'}
目的地: ${d.targetName}
目的地座標: ${d.targetLat.toFixed(6)}, ${d.targetLng.toFixed(6)}
距離: ${d.dist}m ／ 到着圏内: ${d.effectiveArriveDist}m ／ 圏内か: ${d.withinDist ? 'はい' : 'いいえ'}
速度条件クリア: ${d.speedOk===null?'(圏外)':(d.speedOk?'はい':'いいえ')}
継続時間: ${d.heldMs===null?'(未計測)':Math.round(d.heldMs/100)/10+'秒'}（1秒で到着）
到着判定: ${d.announced}
直前完了地点から10m未移動: ${d.autoCompleteBlockedPos ? 'はい（次の自動判定を停止中）' : 'いいえ'}`;
}
function toggleHeadingUp(){
  state.settings.headingUp = !state.settings.headingUp;
  storeSet('settings', state.settings);
  if(state.settings.headingUp){
    // 直前の拡縮・ドラッグ操作で「手動操作中」のフラグが残っていると、
    // ONにしても回転が再開されないため、ここで確実に解除する
    state.manualPan = false;
    updateRecenterBtnState();
    continuousRotationReady = false; // 現在の方位から回転をやり直す
    requestOrientationPermission();
  } else {
    resetMapRotation();
  }
  render();
}
function toggleCompassFallback(){
  state.settings.useCompassFallback = !state.settings.useCompassFallback;
  storeSet('settings', state.settings);
  if(state.settings.useCompassFallback){
    requestOrientationPermission(); // ONにしたときはコンパスの許可・購読を確実に行う
  }
  render();
}
function toggleKeepScreenOn(){
  state.settings.keepScreenOn = !state.settings.keepScreenOn;
  storeSet('settings', state.settings);
  if(state.settings.keepScreenOn && (state.view === 'nav' || state.view === 'checkloc')){
    acquireWakeLock(); // ONにしたとき、既にナビ中ならすぐに取得する
  } else if(!state.settings.keepScreenOn){
    releaseWakeLock(); // OFFにしたときは、すぐに解除する
  }
  render();
}
function toggleArrivalBanner(){
  state.settings.showArrivalBanner = !state.settings.showArrivalBanner;
  storeSet('settings', state.settings);
  render();
}
// 到着した瞬間・配達完了ボタンを押した瞬間に、地図の上に白背景・黒文字で
// textをms（省略時15秒）表示する。到着は20秒、配達完了ボタンは15秒（設定でOFFにしていれば何もしない）
let arrivalBannerTimer = null;
function showArrivalBanner(text, ms){ // ms：表示する時間（省略時15秒）
  if(!state.settings.showArrivalBanner) return;
  const el = document.getElementById('arrivalBannerText');
  if(!el) return;
  el.textContent = text;
  el.style.display = 'block';
  if(arrivalBannerTimer) clearTimeout(arrivalBannerTimer);
  arrivalBannerTimer = setTimeout(()=>{
    el.style.display = 'none';
    arrivalBannerTimer = null;
  }, ms || 15000);
}
function resetZoomLock(){
  state.settings.zoomLocked = false;
  state.settings.lockedZoomLevel = null;
  storeSet('settings', state.settings);
  toast('縮尺の固定を解除しました。自動ズームに戻ります');

}

/* ============ misc ============ */
function escapeHtml(s){
  return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function afterRender(){
  const fi = document.getElementById('fileInput');
  if(fi) fi.addEventListener('change', e=>{ if(e.target.files[0]) handleFileImport(e.target.files[0]); });
  const fi2 = document.getElementById('fileInput2');
  if(fi2) fi2.addEventListener('change', e=>{ if(e.target.files[0]) handleFileImport(e.target.files[0]); });
  const fiSync = document.getElementById('fileInputSync');
  if(fiSync) fiSync.addEventListener('change', e=>{ if(e.target.files[0]) importAllDataFile(e.target.files[0]); });
  const fiPtsCsv = document.getElementById('fileInputPointsCsv');
  if(fiPtsCsv) fiPtsCsv.addEventListener('change', e=>{ const f=e.target.files[0]; e.target.value=''; if(f) importPointsCsv(f); });
  const fiCourse = document.getElementById('fileInputCourse');
  if(fiCourse) fiCourse.addEventListener('change', e=>{ if(e.target.files[0]) importAsNewCourse(e.target.files[0]); });

  // 配達地点の検索欄：日本語入力（IME変換）の途中で再描画してしまうと変換が壊れるため、
  // 変換中かどうかをaddEventListenerで確実に検知する（インラインのcomposition属性は
  // ブラウザによって反映されない場合があるため使わない）
  const searchBox = document.querySelector('.search-box');
  if(searchBox){
    searchBox.addEventListener('compositionstart', ()=>{ pointsFilterComposing = true; });
    searchBox.addEventListener('compositionend', (e)=>{ pointsFilterComposing = false; onPointsFilter(e.target.value); });
  }

  if(state.view==='draw'){
    initDrawMap();
  } else if(state.drawMap){
    try{ state.drawMap.remove(); }catch(e){}
    state.drawMap = null;
    state.rubberBandLine = null; // 画面を離れるので、古いプレビュー線への参照も破棄する
    state.activeDrawSegIdx = null;
    // routeLines等の一覧はここでは空にしない。draw/editmapのどちらに入っても、
    // redrawRouteLayer()が呼ばれた瞬間に自分の地図向けへ正しく入れ替えてくれるため、
    // ここで先に空にすると、切り替えの順序によっては相手側が今まさに描いたばかりの
    // 内容を消してしまうことがある（実際に開発中に発見・修正した不具合）。
    state.drawMapView = null;
  }

  if(state.view==='points'){
    initPointsMap();
    setupOrderDragAndDrop('.points-list-row', true);
  } else if(state.pointsMap){
    try{ state.pointsMap.remove(); }catch(e){}
    state.pointsMap = null;
    // pointsMarkersもここでは空にしない（理由は上のrouteLinesと同じ）。
    // initPointsMap()・initEditMap()はどちらも自分の先頭で必ず作り直す。
    state.pointsMapView = null;
  }

  if(state.view==='editmap'){
    initEditMap();
    setupOrderDragAndDrop('.points-list-row', true);
    initVJumpScrollSync();
  } else if(state.editMap){
    try{ state.editMap.remove(); }catch(e){}
    state.editMap = null;
    state.editMapView = null;
    state.rubberBandLine = null; // 画面を離れるので、古いプレビュー線への参照も破棄する
    state.activeDrawSegIdx = null;
    if(vJumpScrollHandler){ window.removeEventListener('scroll', vJumpScrollHandler, true); vJumpScrollHandler = null; }
  }

  if(state.view==='trailHistory'){
    updateTrailHistoryMap();
  } else if(state.trailHistoryMap){
    try{ state.trailHistoryMap.remove(); }catch(e){}
    state.trailHistoryMap = null;
  }

  if(state.view==='courses'){
    setupCourseFolderDragAndDrop();
  }

  if(state.view==='print'){
    initPrintMap();
  } else if((state.printMaps && state.printMaps.length) || state.printIndexMap){
    (state.printMaps||[]).forEach(m=>{ try{ m.remove(); }catch(e){} });
    state.printMaps = [];
    if(state.printIndexMap){ try{ state.printIndexMap.remove(); }catch(e){} state.printIndexMap = null; }
    state.printPlan = null;
  }

  if(state.view==='nav' && !voiceAutoArmed){
    // ナビ画面に入るたびに、音声待機を自動でオンにする（手動でオフにした場合は、画面を離れるまでオフのまま）
    voiceAutoArmed = true;
    if(!state.voiceStandbyOn) setTimeout(()=>{ if(state.view==='nav' && !state.voiceStandbyOn) startVoiceStandby(true); }, 0);
  }
  if(state.view==='nav' || state.view==='checkloc'){
    initMiniMap();
    // 地図を作り直した直後は、次のGPS更新が来るまで自分の位置のマーカーが
    // 消えたままになってしまうため、すぐに（前回分かっている位置で）表示し直す
    if(state.pos){ try{ updateMiniMap(state.view==='checkloc' ? null : byId(currentTargetId())); }catch(e){ logAppError('afterRender:updateMiniMap', e); } }
    startWatch();
    applyMapRotation();
  } else {
    voiceAutoArmed = false; // 次にナビ画面へ入ったとき、また自動でオンにする
    if(state.voiceStandbyOn) stopVoiceStandby(); // ナビ画面を離れたら音声待機も止める（マイクを使い続けない）
    stopWatch();
    if(state.miniMap){ try{ state.miniMap.remove(); }catch(e){} state.miniMap = null; state.meMarker=null; state.targetMarker=null; state.nextTargetMarker=null; state.lastCompletedMarker=null; state.riskBlinkMarkers=[]; state.otherPointMarkers=[]; state.directionLine=null; state.miniMapView=null; state.buildingMarkers = {}; }
    resetMapRotation();
    state.manualPan = false;
    state.followMode = false;
  }
}

// アプリのどこかでエラーが起きたとき、画面には出さず静かに記録しておく（🐞や📤で確認・送信できる）。
// これまでは多くの箇所で catch(e){} として静かに握りつぶしていたが、それでは実際に何が
// 起きたのか後から追えないため、ここに記録するようにする。
function logAppError(context, err){
  try{
    state.errorLog.push({
      t: Date.now(),
      context,
      message: (err && err.message) ? err.message : String(err),
      stack: (err && err.stack) ? String(err.stack).slice(0,500) : ''
    });
    if(state.errorLog.length > 200) state.errorLog.shift(); // 記録が際限なく増えないよう、古いものから捨てる
  }catch(e){ /* ログ記録自体が失敗しても、アプリ本体は止めない */ }
}
// アプリ全体（どの画面にいても）で、想定外のエラーを自動的に拾って記録する
window.addEventListener('error', (e)=>{
  logAppError('window.onerror', e.error || e.message);
});
window.addEventListener('unhandledrejection', (e)=>{
  logAppError('unhandledrejection', e.reason);
});

// ブラウザ・スマホ側の操作（タブを閉じる、他アプリに切り替える、スマホの戻る操作など）で
// このページ自体を離れようとしたときも、保存していない変更があれば確認を出す。
// アプリ内のボタン経由（goManage等）とは別に、これが最後の砦になる。
window.addEventListener('beforeunload', (e)=>{
  const routeDirty = (state.view==='draw' || state.view==='editmap') && isRouteDirty();
  const pointDirty = isPointPanelDirty();
  if(routeDirty || pointDirty){
    e.preventDefault();
    e.returnValue = ''; // 実際の文言はブラウザ標準のものになる（カスタムメッセージは今のブラウザでは表示できない仕様のため）
  }
});

init();
</script>
