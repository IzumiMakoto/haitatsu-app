const APP_VERSION = 'V51.0 (2026-11-27 CSVと一緒に線と建物も書き出す)'; // 画面（設定・ホーム）とログの両方に表示する。更新のたびにここを書き換える
const PIN_TYPES = [
  {id:'default', label:'標準',     color:'#5b8fd6'},
  {id:'box',     label:'ハコ',     color:'#4caf7d'},
  {id:'slot',    label:'差込口',   color:'#e3a13c'},
  {id:'caution', label:'要注意',   color:'#e0664f'},
  {id:'other',   label:'その他',   color:'#b07fe0'},
];
function pinColor(typeId){
  const t = PIN_TYPES.find(p=>p.id===typeId);
  return t ? t.color : PIN_TYPES[0].color;
}

// ピンタイプ（色）とは別に、地点そのものの「形」で目立たせるための5種類。
// 色は配達ナビ画面では区別されないため、代わりに形で区別できるようにしている。
const SPECIAL_SHAPES = [
  {id:'star',     label:'星',     glyph:'★', cssClass:'star-pin'},
  {id:'triangle', label:'三角',   glyph:'▲', cssClass:'triangle-pin'},
  {id:'square',   label:'四角',   glyph:'■', cssClass:'square-pin'},
  {id:'diamond',  label:'ひし形', glyph:'◆', cssClass:'diamond-pin'},
  {id:'hexagon',  label:'六角形', glyph:'⬢', cssClass:'hexagon-pin'},
];
// 地点の特別な形を取得する（'' | 'star' | 'triangle' | 'square' | 'diamond' | 'hexagon'）。
// 以前の「isStarred」だけが立っているデータとの後方互換のため、指定が無ければ
// isStarredを星として扱う。
function getSpecialShape(m){
  if(m.specialShape) return m.specialShape;
  if(m.isStarred) return 'star';
  return '';
}
function shapeCssClass(shapeId){
  const s = SPECIAL_SHAPES.find(x=>x.id===shapeId);
  return s ? s.cssClass : 'point-pin';
}
function shapeGlyph(shapeId){
  const s = SPECIAL_SHAPES.find(x=>x.id===shapeId);
  return s ? s.glyph : '';
}
// 地図上のマーカーサイズ：★はそのまま、★以外の4形状は少し小さく表示する
function shapeSize(shapeId, baseSize){
  return shapeId==='star' ? baseSize : Math.round(baseSize*0.7);
}
// 地点一覧の行に表示する、地図と同じ色・同じ形の小さな目印バッジ。
// 形が指定されていれば地図と同じグリフ(★▲■◆⬢)を、無ければ地図と同じ色の丸を表示する。
// 色は「ピンの種類」(pinColor)から取る——地図上のピンと完全に同じ色にするため、
// 形の内訳表示用の配色(shapeGlyphColorForHome)とは別物なので混同しないこと。
function pointListBadgeHtml(m){
  const color = m.isLandmark ? '#8a94ab' : pinColor(m.pinType);
  const shape = getSpecialShape(m);
  if(shape){
    return `<div class="pt-list-badge" style="width:22px;height:22px;border-radius:7px;background:var(--bg-elev);display:flex;align-items:center;justify-content:center;font-size:12px;flex:none;color:${color};">${shapeGlyph(shape)}</div>`;
  }
  return `<div class="pt-list-badge" style="width:14px;height:14px;border-radius:50%;background:${color};flex:none;margin:0 4px;"></div>`;
}

/* ============ ストレージ util ============ */
/* このアプリはClaude.aiのアーティファクト機能を使わず、ブラウザ標準のlocalStorageに
   データを保存します。HTMLファイルをダウンロードしてそのままブラウザで開く／
   自分のサーバー（Netlifyなど）にアップロードして使う、という単体運用が前提です。 */
const STORAGE_PREFIX = 'haitatsu_navi_v1__';

/* 配達先・ルート順・描いたルート・進捗は「コース（配達区域）」ごとに分けて保存する。
   state.currentCourseId が設定されている間、これらのキーは自動的にコースごとのキーに
   読み替えられる（呼び出し側のコードは変更不要）。 */
const COURSE_SCOPED_KEYS = ['markers','route-order','route-path','route-colors','progress','buildings'];
function scopedKey(key){
  if(COURSE_SCOPED_KEYS.includes(key) && state.currentCourseId){
    return key + '::' + state.currentCourseId;
  }
  return key;
}
async function storeGet(key){
  try{
    const raw = localStorage.getItem(STORAGE_PREFIX + scopedKey(key));
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
async function storeSet(key, val){
  try{
    localStorage.setItem(STORAGE_PREFIX + scopedKey(key), JSON.stringify(val));
    return true;
  }catch(e){ console.error('storage set failed', e); return false; }
}
function storeRemoveRaw(rawKeyNoPrefix){
  try{ localStorage.removeItem(STORAGE_PREFIX + rawKeyNoPrefix); }catch(e){}
}

/* ---- 端末間でデータを引き継ぐためのエクスポート/インポート ----
   localStorageは端末（ブラウザ）ごとに独立しているため、自動では同期されません。
   パソコンで編集 → エクスポート → スマホに転送 → インポート、という流れで引き継ぎます。
   すべてのコース（配達区域）をまとめて書き出し／読み込みします。 */
async function toggleExportCourse(courseId, checked){
  if(checked){
    if(!state.exportSelectedCourseIds.includes(courseId)) state.exportSelectedCourseIds.push(courseId);
  } else {
    state.exportSelectedCourseIds = state.exportSelectedCourseIds.filter(id=>id!==courseId);
  }
  await storeSet('export-selected-course-ids', state.exportSelectedCourseIds);
  render();
}

async function selectAllExportCourses(){
  state.exportSelectedCourseIds = state.courses.map(c=>c.id);
  await storeSet('export-selected-course-ids', state.exportSelectedCourseIds);
  render();
}

async function deselectAllExportCourses(){
  state.exportSelectedCourseIds = [];
  await storeSet('export-selected-course-ids', state.exportSelectedCourseIds);
  render();
}

/* ============ 地点データのCSV書き出し／読み込み（Excelで編集用） ============
   列（色は末尾。読み込み時、「順番」の列があれば並び順も反映）：コース名, 番号, 名前, メモ, 緯度, 経度, 形, 目印, 非表示, 到着距離, 条件付き配達, 配達曜日, 開始日, 終了日, 繰り返し, 休止開始, 休止終了, 期間外通知を隠す, ID
   ・書き出し：チェックした区域の全地点を1つのCSVに入れる（コース名の列で区別。Excelで文字化けしないようBOM付き）
   ・読み込み：コース名の列で振り分ける。IDが一致する行は、名前・メモ・緯度・経度・形を更新する
     （条件・休止・目印などその他の設定は変えない）。IDが空、または一致しない行は新しい地点として末尾に追加する。
     コースが無ければ新しく作る。CSVに無い既存の地点は削除しない。ルートの順番（線）は変えない。 */
const CSV_HEADERS = ['コース名','番号','名前','メモ','緯度','経度','形','目印','非表示','到着距離','条件付き配達','配達曜日','開始日','終了日','繰り返し','休止開始','休止終了','期間外通知を隠す','ID','色'];
const CSV_SHAPE_LABELS = {star:'星', triangle:'三角', square:'四角', diamond:'ひし形', hexagon:'六角形'};
function csvShapeFromText(t){
  const x = String(t||'').trim();
  if(!x) return '';
  for(const sh of SPECIAL_SHAPES){
    if(x===sh.id || x===sh.label || x===sh.glyph) return sh.id;
  }
  return null; // 読み取れない形
}
const CSV_DOW = ['日','月','火','水','木','金','土','祝'];
const CSV_REPEAT_LABELS = {none:'なし', yearly:'毎年', koutai:'交代読者'};
function csvBool(t){ return /^(○|〇|◯|1|true|yes|はい|有|あり)$/i.test(String(t||'').trim()); }
// 日付：2026/6/1・2026-06-01・2026年6月1日 を 2026-06-01 に。空は null、読めなければ undefined
function csvDate(t){
  const x = String(t||'').trim();
  if(!x) return null;
  const m = x.match(/^(\d{4})[\/\-.年]\s*(\d{1,2})[\/\-.月]\s*(\d{1,2})日?$/);
  if(!m) return undefined;
  const y=+m[1], mo=+m[2], d=+m[3];
  const dt = new Date(y, mo-1, d);
  if(dt.getFullYear()!==y || dt.getMonth()!==mo-1 || dt.getDate()!==d) return undefined;
  return y+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0');
}
function csvRepeat(t){
  const x = String(t||'').trim();
  if(!x || x==='なし' || x==='none') return 'none';
  if(x==='毎年' || x==='yearly') return 'yearly';
  if(x==='交代読者' || x==='koutai') return 'koutai';
  return null;
}
function csvWeekdays(t){
  const x = String(t||'').replace(/[\s,、]/g,'');
  const out = [];
  for(const ch of x){
    const i = CSV_DOW.indexOf(ch);
    if(i<0) return null;
    if(!out.includes(i)) out.push(i);
  }
  return out.sort((a,b)=>a-b);
}
function csvQuote(v){
  const x = (v==null) ? '' : String(v);
  return /[",\r\n]/.test(x) ? '"' + x.replace(/"/g,'""') + '"' : x;
}
// 引用符の中の改行・カンマ・""に対応したCSV解析（先頭のBOMは除く）
function parseCsvRows(text){
  text = String(text||'').replace(/^﻿/, '');
  const rows = []; let row = [], cur = '', q = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){ cur+='"'; i++; } else q=false; }
      else cur += c;
    } else if(c==='"'){ q = true; }
    else if(c===','){ row.push(cur); cur=''; }
    else if(c==='\r'){ /* 無視 */ }
    else if(c==='\n'){ row.push(cur); rows.push(row); row=[]; cur=''; }
    else cur += c;
  }
  if(cur.length || row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r=>r.some(v=>String(v).trim()!==''));
}
async function withCourseScope(courseId, fn){
  const saved = state.currentCourseId;
  state.currentCourseId = courseId;
  try{ return await fn(); }
  finally{ state.currentCourseId = saved; }
}
async function exportPointsCsv(){
  const selected = state.courses.filter(c => state.exportSelectedCourseIds.includes(c.id));
  if(!selected.length){ toast('書き出す配達区域を1つ以上チェックしてください'); return; }
  const lines = [CSV_HEADERS.map(csvQuote).join(',')];
  let total = 0;
  for(const c of selected){
    const markers = await withCourseScope(c.id, ()=>storeGet('markers')) || [];
    const order = await withCourseScope(c.id, ()=>storeGet('route-order')) || [];
    const rank = {}; order.forEach((id,i)=>{ rank[id]=i+1; });
    const sorted = markers.slice().sort((a,b)=>(rank[a.id]||1e9)-(rank[b.id]||1e9));
    sorted.forEach((m,i)=>{
      total++;
      const rep = m.condRepeatMode || (m.condRepeatYearly ? 'yearly' : 'none');
      const cond = !!m.condEnabled;
      lines.push([c.name, rank[m.id]||(i+1), m.name||'', m.memo||'', m.lat, m.lng,
        CSV_SHAPE_LABELS[getSpecialShape(m)]||'',
        m.isLandmark?'○':'', m.isHidden?'○':'',
        (m.customArriveDist!=null)?m.customArriveDist:'',
        cond?'○':'',
        cond ? (m.condWeekdays||[]).slice().sort((a,b)=>a-b).map(d=>CSV_DOW[d]).join('') : '',
        cond ? (m.condStartDate||'') : '', cond ? (m.condEndDate||'') : '',
        cond ? CSV_REPEAT_LABELS[rep] : '',
        m.condPauseStart||'', m.condPauseEnd||'',
        (cond && m.condHideNotice)?'○':'',
        m.id, (PIN_TYPES.find(p=>p.id===m.pinType)||PIN_TYPES[0]).label].map(csvQuote).join(','));
    });
  }
  const blob = new Blob(['﻿' + lines.join('\r\n') + '\r\n'], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const now = new Date();
  const stamp = String(now.getFullYear()).slice(-2) + String(now.getMonth()+1).padStart(2,'0') + String(now.getDate()).padStart(2,'0');
  const a = document.createElement('a');
  a.href = url; a.download = '地点一覧_' + stamp + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 5000);
  // V51.0：地点エディタで線と建物も使えるよう、同じコースの線と建物を「線と建物_日付.json」として一緒に書き出す
  //（中身は「全データを書き出す」と同じ形。エディタでCSVを選ぶときに、このファイルも一緒に選ぶと線と建物が入る）
  const rb = { courses: selected.map(c=>({id:c.id, name:c.name})), perCourse:{}, kind:'routes-buildings' };
  let nSeg = 0, nBld = 0;
  for(const c of selected){
    await withCourseScope(c.id, async ()=>{
      const rp = await storeGet('route-path'), rc = await storeGet('route-colors'), bl = await storeGet('buildings');
      rb.perCourse[c.id] = { routePath: rp || [], routeColors: rc || [], buildings: bl || [] };
      nSeg += Array.isArray(rp) ? (rp.length && rp[0] && typeof rp[0].lat==='number' ? 1 : rp.length) : 0;
      nBld += Array.isArray(bl) ? bl.length : 0;
    });
  }
  if(nSeg || nBld){
    setTimeout(()=>{
      const b2 = new Blob([JSON.stringify(rb)], {type:'application/json'});
      const u2 = URL.createObjectURL(b2), a2 = document.createElement('a');
      a2.href = u2; a2.download = '線と建物_' + stamp + '.json';
      document.body.appendChild(a2); a2.click(); a2.remove();
      setTimeout(()=>URL.revokeObjectURL(u2), 5000);
    }, 800);
  }
  toast('✓ 地点一覧をCSVで書き出しました（' + total + '件）' + ((nSeg||nBld) ? '。線' + nSeg + '本・建物' + nBld + '件も「線と建物_' + stamp + '.json」として書き出します' : '') + '（「ダウンロード」フォルダに保存されます）', 6000);
}
function applyCsvOpt(m, o){
  if(!o) return;
  ['isLandmark','isHidden','customArriveDist','condEnabled','condPauseStart','condPauseEnd'].forEach(k=>{ if(k in o) m[k] = o[k]; });
  if(m.condEnabled){
    if('condWeekdays' in o) m.condWeekdays = o.condWeekdays;
    if('condStartDate' in o) m.condStartDate = o.condStartDate;
    if('condEndDate' in o) m.condEndDate = o.condEndDate;
    if('condRepeatMode' in o){ m.condRepeatMode = o.condRepeatMode; m.condRepeatYearly = (o.condRepeatMode==='yearly'); }
    if('condHideNotice' in o) m.condHideNotice = o.condHideNotice;
  }
}
async function readCsvFileText(file){
  // Excelの「CSV（カンマ区切り）」はShift_JIS、「CSV UTF-8」はUTF-8。どちらでも読めるようにする
  const buf = await file.arrayBuffer();
  try{ return new TextDecoder('utf-8', {fatal:true}).decode(buf); }
  catch(e){ return new TextDecoder('shift_jis').decode(buf); }
}
async function importPointsCsv(file, rtPay){
  try{
    const rows = parseCsvRows(await readCsvFileText(file));
    if(rows.length < 2){ toast('CSVにデータがありません'); return; }
    const head = rows[0].map(h=>String(h).trim());
    const col = names => head.findIndex(h=>names.includes(h));
    const iCourse = col(['コース名','コース','区域']), iName = col(['名前']), iLat = col(['緯度','lat']), iLng = col(['経度','lng']);
    const iColor = col(['色']), iOrd = col(['順番']), iDel = col(['削除']), iOld = col(['旧コース名']);
    const iNo = col(['番号']), iMemo = col(['メモ']), iShape = col(['形']), iId = col(['ID','id']);
    const iOName = col(['元の名前']), iOLat = col(['元の緯度']), iOLng = col(['元の経度']), iOMemo = col(['元のメモ']); // 地点エディタが付ける「直す前の名前・位置」（同じ地点を見つける手がかり）
    const iLm = col(['目印']), iHid = col(['非表示']), iArr = col(['到着距離']), iCond = col(['条件付き配達']), iWd = col(['配達曜日']),
          iSt = col(['開始日']), iEn = col(['終了日']), iRep = col(['繰り返し']), iPs = col(['休止開始']), iPe = col(['休止終了']), iHn = col(['期間外通知を隠す']);
    if(iCourse<0 || iName<0 || iId<0){
      toast('見出しに「コース名」「名前」「ID」が必要です', 5000); return;
    }
    // コースごとに振り分け、問題のある行は理由つきで集める
    const groups = {}; const problems = [];
    for(let r=1;r<rows.length;r++){
      const cols = rows[r]; const line = r+1;
      const cname = String(cols[iCourse]||'').trim();
      // 緯度・経度の列は無くてもよい（既存の地点はIDで見つけて、今の位置のまま使う）
      const latT = iLat>=0 ? String(cols[iLat]||'').trim() : '', lngT = iLng>=0 ? String(cols[iLng]||'').trim() : '';
      const hasLL = latT!=='' && lngT!=='';
      const lat = hasLL ? parseFloat(latT) : null, lng = hasLL ? parseFloat(lngT) : null;
      if(!cname){ problems.push(line+'行目：コース名が空です'); continue; }
      if(hasLL && (isNaN(lat) || isNaN(lng) || lat<-90 || lat>90 || lng<-180 || lng>180)){ problems.push(line+'行目：緯度・経度が正しくありません'); continue; }
      const shape = iShape>=0 ? csvShapeFromText(cols[iShape]) : undefined;
      if(shape===null){ problems.push(line+'行目：形「'+cols[iShape]+'」が読み取れません'); continue; }
      // 配達の設定（その列がCSVにあるときだけ読む。空欄はオフ・未設定として扱う）
      const opt = {};
      let bad = null;
      if(iLm>=0) opt.isLandmark = csvBool(cols[iLm]);
      if(iHid>=0) opt.isHidden = csvBool(cols[iHid]);
      if(iArr>=0){
        const t = String(cols[iArr]||'').trim();
        if(!t) opt.customArriveDist = null;
        else { const v = parseFloat(t); if(isNaN(v) || v<5 || v>300) bad = '到着距離は5〜300で入力してください'; else opt.customArriveDist = Math.round(v); }
      }
      if(iCond>=0) opt.condEnabled = csvBool(cols[iCond]);
      if(iWd>=0){ const w = csvWeekdays(cols[iWd]); if(w===null) bad = '配達曜日は「月火水木金土日祝」の文字で入力してください'; else opt.condWeekdays = w; }
      if(iSt>=0){ const d = csvDate(cols[iSt]); if(d===undefined) bad = '開始日の日付が読み取れません'; else opt.condStartDate = d; }
      if(iEn>=0){ const d = csvDate(cols[iEn]); if(d===undefined) bad = '終了日の日付が読み取れません'; else opt.condEndDate = d; }
      if(iRep>=0){ const v = csvRepeat(cols[iRep]); if(v===null) bad = '繰り返しは「なし・毎年・交代読者」から選んでください'; else opt.condRepeatMode = v; }
      if(iPs>=0){ const d = csvDate(cols[iPs]); if(d===undefined) bad = '休止開始の日付が読み取れません'; else opt.condPauseStart = d; }
      if(iPe>=0){ const d = csvDate(cols[iPe]); if(d===undefined) bad = '休止終了の日付が読み取れません'; else opt.condPauseEnd = d; }
      if(iHn>=0) opt.condHideNotice = csvBool(cols[iHn]);
      let color;
      if(iColor>=0){
        const ct = String(cols[iColor]||'').trim();
        if(ct){ const pt = PIN_TYPES.find(p=>p.label===ct || p.id===ct); if(!pt) bad = '色「'+ct+'」が読み取れません（標準・ハコ・差込口・要注意・その他）'; else color = pt.id; }
      }
      if(!bad && opt.condEnabled && opt.condRepeatMode==='none' && opt.condStartDate && opt.condEndDate && opt.condEndDate<opt.condStartDate) bad = '終了日が開始日より前になっています';
      if(!bad && opt.condEnabled && opt.condRepeatMode==='koutai' && !opt.condStartDate) bad = '交代読者は開始日が必要です';
      if(bad){ problems.push(line+'行目：'+bad); continue; }
      (groups[cname] = groups[cname] || []).push({
        opt,
        name: String(cols[iName]||'').trim() || '(無題)',
        memo: iMemo>=0 ? String(cols[iMemo]||'') : undefined,
        lat, lng, shape,
        no: iNo>=0 ? parseFloat(cols[iNo]) : NaN,
        color, ord: iOrd>=0 ? parseFloat(cols[iOrd]) : NaN,
        del: iDel>=0 && csvBool(cols[iDel]), oldCourse: iOld>=0 ? String(cols[iOld]||'').trim() : '',
        id: iId>=0 ? String(cols[iId]||'').trim() : '',
        oname: iOName>=0 ? String(cols[iOName]||'').trim() : '',
        olat: iOLat>=0 ? parseFloat(cols[iOLat]) : NaN, olng: iOLng>=0 ? parseFloat(cols[iOLng]) : NaN,
        omemo: iOMemo>=0 ? String(cols[iOMemo]||'') : undefined
      });
    }
    if(problems.length){
      toast('読み込めない行があるため中止しました：' + problems.slice(0,3).join(' ／ ') + (problems.length>3?(' ほか'+(problems.length-3)+'件'):''), 8000);
      return;
    }
    // 変更内容の確認用の集計
    // 他のコースにある地点（コース移動の判定用）と、コース名の変更（旧コース名の列）の判定
    const idMap = new Map(), allMk = [], usedX = new Set();
    for(const c of state.courses){
      const mk = (await withCourseScope(c.id, ()=>storeGet('markers'))) || [];
      mk.forEach(m=>{ idMap.set(m.id, c); allMk.push({m, c}); });
    }
    const renameFrom = {};
    Object.keys(groups).forEach(cn=>{
      const og = groups[cn].find(g=>g.oldCourse);
      const old = og ? og.oldCourse : '';
      if(old && old!==cn && !state.courses.find(c=>c.name===cn) && state.courses.find(c=>c.name===old)) renameFrom[cn] = old;
    });
    const plan = [];
    for(const cname of Object.keys(groups)){
      const course = state.courses.find(c=>c.name===cname) || (renameFrom[cname] ? state.courses.find(c=>c.name===renameFrom[cname]) : null);
      const existing = course ? (await withCourseScope(course.id, ()=>storeGet('markers')) || []) : [];
      const byId = {}; existing.forEach(m=>{ byId[m.id]=m; });
      let upd=0, add=0, mov=0, del=0, same=0;
      // まったく同じ地点なら入れ替える：IDが見つからなくても、このコースに「同じ名前・3m以内」の地点が1つだけあれば、その地点として扱う
      // （直す前の名前・位置があればそれで探し、無ければ・見つからなければ今の名前・位置で探す）
      const used = new Set(groups[cname].filter(g=>g.id && byId[g.id]).map(g=>g.id));
      const nrm = t=>String(t||'').replace(/[\s　]+/g,'');
      const findSame = (nm, la, lo)=>{
        if(!nm || la==null || lo==null || isNaN(la) || isNaN(lo)) return null;
        const hit = existing.filter(m=>!used.has(m.id) && nrm(m.name)===nrm(nm) && haversine(m.lat,m.lng,la,lo)<=3);
        return hit.length===1 ? hit[0] : null;
      };
      groups[cname].forEach(g=>{
        if(g.id && byId[g.id]) return;
        if(g.id && idMap.has(g.id)) return; // 他のコースにある地点（移動）は今までどおり
        const m = findSame(g.oname, g.olat, g.olng) || findSame(g.name, g.lat, g.lng);
        if(m){ g.id = m.id; g.sameMatch = true; used.add(m.id); same++; return; }
        // このコースに無ければ、ほかのコースから「直す前の名前・位置」で探す（コースを移した地点。見つかれば移動として扱う）
        if(g.oname && !isNaN(g.olat) && !isNaN(g.olng)){
          const hit = allMk.filter(x=>x.c!==course && !usedX.has(x.m.id) && nrm(x.m.name)===nrm(g.oname) && haversine(x.m.lat,x.m.lng,g.olat,g.olng)<=3);
          if(hit.length===1){ g.id = hit[0].m.id; g.sameMatch = true; usedX.add(g.id); same++; }
        }
      });
      groups[cname].forEach(g=>{
        if(g.del){ if(g.id && byId[g.id]) del++; }
        else if(g.id && byId[g.id]) upd++;
        else if(g.id && idMap.has(g.id)) mov++;
        else if(g.lat==null){ problems.push('「'+cname+'」の「'+g.name+'」：新しい地点は緯度・経度が必要です（地図で追加するか、IDを正しく入れてください）'); }
        else add++;
      });
      // 食い違いの確認：この端末の今の内容が、リンクを作ったときの「直す前の内容」とも「直した後の内容」とも違う地点
      // （古い内容で作られたリンク、またはこの端末で直していた地点。すでに同じ変更が入っている場合は食い違いにしない）
      const confNames = [];
      groups[cname].forEach(g=>{
        if(!g.oname || !g.id || !byId[g.id]) return;
        const m = byId[g.id], bad = [];
        if(nrm(m.name)!==nrm(g.oname) && nrm(m.name)!==nrm(g.name)) bad.push('名前');
        if(!isNaN(g.olat) && !isNaN(g.olng) && haversine(m.lat,m.lng,g.olat,g.olng)>3 && !(g.lat!=null && haversine(m.lat,m.lng,g.lat,g.lng)<=3)) bad.push('位置');
        if(g.omemo!==undefined && nrm(m.memo)!==nrm(g.omemo) && !(g.memo!==undefined && nrm(m.memo)===nrm(g.memo))) bad.push('メモ');
        if(bad.length) confNames.push('「'+(m.name||'(無題)')+'」の'+bad.join('・'));
      });
      plan.push({cname, course, existing, upd, add, mov, del, same, conf: confNames});
    }
    if(problems.length){
      toast('反映できない行があるため中止しました：' + problems.slice(0,3).join(' ／ ') + (problems.length>3?(' ほか'+(problems.length-3)+'件'):''), 9000);
      return;
    }
    const msg = plan.map(p=>'・'+p.cname+(renameFrom[p.cname]?'（コース名を「'+renameFrom[p.cname]+'」から変更）':(p.course?'':'（新しいコース）'))+'：更新'+p.upd+'件／追加'+p.add+'件'+(p.mov?'／他のコースから移動'+p.mov+'件':'')+(p.del?'／削除'+p.del+'件':'')+(p.same?'\n　（うち'+p.same+'件は、IDが違うため「同じ名前・同じ場所」の地点を見つけて反映します）':'')+(p.conf.length?'\n　⚠ '+p.conf.length+'件は、この端末の内容が、リンクを作ったときの内容と違います：'+p.conf.slice(0,3).join('、')+(p.conf.length>3?' ほか':''):'')).join('\n')+(plan.some(p=>p.conf.length)?'\n\n⚠ 食い違いがあります（古い内容で作られたリンクか、この端末で直した地点です）。心当たりがなければ「キャンセル」して、販売所に連絡してください。':'')+(plan.some(p=>p.del)?'\n\n⚠ 削除した地点は元に戻せません。':'');
    const rtMsg = rtPay ? '\n\n'+routePayloadText(rtPay, plan.map(p=>p.cname)) : '';
    if(!confirm('CSVの内容を反映します。\n\n'+msg+rtMsg+'\n\n※CSVに無い既存の地点は削除しません（「削除」の列に○がある地点だけ削除します）。\n'+(plan.some(p=>groups[p.cname].some(g=>!isNaN(g.ord)))?'※並び順（順番の列）も反映します。':'※ルートの順番は変わりません（追加した地点は末尾に入ります）。')+'\n\nよろしいですか？')) return;
    // 元に戻す用の控え（反映する直前の地点・ルート順・コース一覧・削除の記録）を残す
    if(!takeUndoSnapshot(file.name) && !confirm('元に戻す用の控えを保存できませんでした（端末の保存容量が足りない可能性があります）。\n\nこのまま反映しますか？')) return;

    const savedCourseId = state.currentCourseId;
    // 他のコースにある地点は、元のコースから取り出して、移動先で更新する
    for(const p of plan){
      for(const g of groups[p.cname]){
        if(g.del || !g.id || p.existing.some(m=>m.id===g.id)) continue;
        const src = idMap.get(g.id);
        if(!src) continue;
        await withCourseScope(src.id, async ()=>{
          const mk = (await storeGet('markers')) || [];
          const od = (await storeGet('route-order')) || mk.map(m=>m.id);
          const i = mk.findIndex(m=>m.id===g.id);
          if(i>=0){
            g.moved = mk.splice(i,1)[0];
            await storeSet('markers', mk);
            await storeSet('route-order', od.filter(x=>x!==g.id));
            src.count = mk.length;
          }
        });
      }
    }
    for(const p of plan){
      let course = p.course;
      if(!course){
        course = {id:'c'+Date.now()+Math.floor(Math.random()*1000), name:p.cname, count:0};
        state.courses.push(course);
      } else if(renameFrom[p.cname]){
        course.name = p.cname;
      }
      await withCourseScope(course.id, async ()=>{
        const markers = (await storeGet('markers')) || [];
        const order = (await storeGet('route-order')) || markers.map(m=>m.id);
        const byId = {}; markers.forEach(m=>{ byId[m.id]=m; });
        let seq = 0;
        const deletedMs = [];
        groups[p.cname].forEach(g=>{
          let m = g.id ? byId[g.id] : null;
          if(g.del){
            if(m){
              markers.splice(markers.indexOf(m), 1);
              const oi = order.indexOf(m.id); if(oi>=0) order.splice(oi, 1);
              delete byId[m.id]; deletedMs.push(m);
            }
            return;
          }
          if(!m && g.moved){ m = g.moved; markers.push(m); order.push(m.id); byId[m.id] = m; }
          if(m){
            m.name = g.name;
            if(g.lat!=null){ m.lat = g.lat; m.lng = g.lng; }
            if(g.memo!==undefined) m.memo = g.memo;
            if(g.shape!==undefined){ m.specialShape = g.shape; if(m.isStarred) m.isStarred = (g.shape==='star'); }
            applyCsvOpt(m, g.opt);
            if(g.color) m.pinType = g.color;
            g.mid = m.id;
          } else {
            const nid = 'm' + Date.now() + '_' + (++seq) + '_' + Math.floor(Math.random()*1000);
            const nm = {id:nid, name:g.name, memo:g.memo||'', lat:g.lat, lng:g.lng, folder:'', order:markers.length+1,
              pinType:'default', isLandmark:false, isHidden:false, specialShape:g.shape||''};
            applyCsvOpt(nm, g.opt);
            if(g.color) nm.pinType = g.color;
            g.mid = nid;
            markers.push(nm); order.push(nid); byId[nid] = nm;
          }
        });
        // 「順番」の列があるときだけ、並び順を反映する（その行の順に並べ、CSVに無い地点はその後ろに今の順で残す）
        const ordRows = groups[p.cname].filter(g=>g.mid && !isNaN(g.ord)).sort((a,b)=>a.ord-b.ord);
        if(ordRows.length){
          const first = ordRows.map(g=>g.mid);
          const set = new Set(first);
          const rest = order.filter(id=>!set.has(id));
          order.length = 0; first.concat(rest).forEach(id=>order.push(id));
        }
        if(deletedMs.length){
          const delSet = new Set(deletedMs.map(m=>m.id));
          const pr = await storeGet('progress');
          if(pr && Array.isArray(pr.done)){ pr.done = pr.done.filter(x=>!delSet.has(x)); await storeSet('progress', pr); }
          const lg = (await storeGet('deleted-log')) || [];
          deletedMs.forEach(m=>lg.push({id:m.id, name:m.name||'(無題)', memo:m.memo||'', lat:m.lat, lng:m.lng, deletedAt:Date.now()}));
          await storeSet('deleted-log', lg);
        }
        await storeSet('markers', markers);
        await storeSet('route-order', order);
        if(!(await storeGet('progress'))) await storeSet('progress', {date: todayStr(), done:[], doneMeta:{}, skippedIds:[]});
        course.count = markers.length;
      });
    }
    await storeSet('courses-list', state.courses);
    if(rtPay) await applyRoutePayload(rtPay);
    state.currentCourseId = savedCourseId;
    await reloadCourseData();
    toast('✓ 反映しました。元に戻すときは「設定」→「↩ 直前の反映を元に戻す」', 6000);
    render();
  }catch(e){
    console.error(e);
    toast('CSVの読み込みに失敗しました: ' + e.message, 5000);
  }
}

async function exportAllData(){
  const selectedCourses = state.courses.filter(c => state.exportSelectedCourseIds.includes(c.id));
  if(!selectedCourses.length){ toast('書き出す配達区域を1つ以上チェックしてください'); return; }

  const data = { courses: selectedCourses, currentCourseId: state.currentCourseId, perCourse:{} };
  data.settings = await storeGet('settings');
  // 軌跡の履歴は特定のコースに属さない（日付ごとの記録なので）、まとめて1回だけ書き出す
  data.trailHistory = await storeGet('trailHistory');
  for(const c of selectedCourses){
    const savedCurrent = state.currentCourseId;
    state.currentCourseId = c.id;
    data.perCourse[c.id] = {
      markers: await storeGet('markers'),
      routeOrder: await storeGet('route-order'),
      routePath: await storeGet('route-path'),
      routeColors: await storeGet('route-colors'),
      progress: await storeGet('progress'),
      buildings: await storeGet('buildings'),
    };
    state.currentCourseId = savedCurrent;
  }
  data.__exportedAt = new Date().toISOString();
  data.__app = 'haitatsu-navi';
  const blob = new Blob([JSON.stringify(data, null, 0)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');

  // ファイル名は「区域名　YYMMDD①」の形にする：
  // ・年は下2桁（26=2026年）、時刻は入れない
  // ・同じ日に同じ区域の組み合わせで何度も書き出した場合は、上書きにならないよう①②③…と増やす
  const now = new Date();
  const yy = String(now.getFullYear()).slice(-2);
  const mm = String(now.getMonth()+1).padStart(2,'0');
  const dd = String(now.getDate()).padStart(2,'0');
  const dateStamp = `${yy}${mm}${dd}`;
  const sanitize = s => String(s||'').replace(/[\\/:*?"<>|]/g,'').replace(/\s+/g,'').slice(0,20);
  let courseLabel;
  if(selectedCourses.length === state.courses.length){
    courseLabel = '全コース';
  } else if(selectedCourses.length <= 3){
    courseLabel = selectedCourses.map(c=>sanitize(c.name)).join('＋');
  } else {
    courseLabel = selectedCourses.length + '件選択';
  }

  // 「日付＋区域名」の組み合わせごとに、今日何回書き出したかを数えて①②③…を決める
  const todayKey = todayStr();
  const exportCounts = (await storeGet('exportCounts')) || {};
  if(exportCounts.date !== todayKey){ exportCounts.date = todayKey; exportCounts.byLabel = {}; }
  if(!exportCounts.byLabel) exportCounts.byLabel = {};
  const exportSeq = (exportCounts.byLabel[courseLabel] || 0) + 1;
  exportCounts.byLabel[courseLabel] = exportSeq;
  await storeSet('exportCounts', exportCounts);
  const CIRCLED_NUMS = ['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩','⑪','⑫','⑬','⑭','⑮','⑯','⑰','⑱','⑲','⑳'];
  const seqSuffix = CIRCLED_NUMS[exportSeq-1] || `(${exportSeq})`;

  a.href = url;
  a.download = `${courseLabel}　${dateStamp}${seqSuffix}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
  const summaryLines = selectedCourses.map(c => routeStatsLine(c.name, data.perCourse[c.id])).join('\n');
  toast(`✓ 書き出しました（このファイルを別の端末に送って読み込んでください）\n${summaryLines}`, 6000);
}
// 書き出し・読み込みの確認用：1コース分の「地点数・線の本数・頂点数」を1行にまとめる
function routeStatsLine(courseName, pc){
  const markerCount = (pc && pc.markers) ? pc.markers.length : 0;
  const routePath = (pc && Array.isArray(pc.routePath)) ? pc.routePath : [];
  const isOldFlatFormat = routePath[0] && typeof routePath[0].lat === 'number';
  const segments = isOldFlatFormat ? [routePath] : routePath;
  const segCount = segments.length;
  const vertexCount = segments.reduce((sum, seg) => sum + (Array.isArray(seg) ? seg.length : 0), 0);
  return `${courseName}：地点${markerCount}件・線${segCount}本・頂点${vertexCount}点`;
}
async function importAllDataFile(file){
  try{
    const text = await file.text();
    const data = JSON.parse(text);
    if(data.__app !== 'haitatsu-navi'){ toast('このアプリのデータファイルではないようです'); return; }

    // 軌跡の履歴（日付ごとの記録）は、コースとは無関係に、既存のものと日付単位でマージする
    // （読み込み側にしか無い日付はそのまま残し、同じ日付があれば読み込んだファイルの内容を使う）
    if(Array.isArray(data.trailHistory) && data.trailHistory.length){
      const existingHistory = (await storeGet('trailHistory')) || [];
      const byDate = new Map(existingHistory.map(h=>[h.date, h]));
      data.trailHistory.forEach(h => byDate.set(h.date, h));
      const mergedHistory = Array.from(byDate.values()).sort((a,b)=>String(a.date).localeCompare(String(b.date)));
      await storeSet('trailHistory', mergedHistory);
    }

    if(Array.isArray(data.courses) && data.perCourse){
      // 一部の配達区域だけを書き出したファイルでも、この端末にある他の区域を消さないよう
      // 既存の一覧に「追加・更新」する形でマージする（丸ごと上書きはしない）
      const existingCourses = (await storeGet('courses-list')) || [];
      const byId = new Map(existingCourses.map(c=>[c.id, c]));
      data.courses.forEach(c => byId.set(c.id, c));
      const mergedCourses = Array.from(byId.values());
      await storeSet('courses-list', mergedCourses);

      const importedIds = new Set(data.courses.map(c=>c.id));
      const newCurrentId = (data.currentCourseId && importedIds.has(data.currentCourseId))
        ? data.currentCourseId
        : data.courses[0].id;
      await storeSet('current-course-id', newCurrentId);

      if(data.settings) await storeSet('settings', data.settings);
      const savedCurrent = state.currentCourseId;
      for(const c of data.courses){
        state.currentCourseId = c.id;
        const pc = data.perCourse[c.id] || {};
        if(pc.markers) await storeSet('markers', pc.markers);
        if(pc.routeOrder) await storeSet('route-order', pc.routeOrder);
        if(pc.routePath) await storeSet('route-path', pc.routePath);
        if(pc.routeColors) await storeSet('route-colors', pc.routeColors);
        if(pc.progress) await storeSet('progress', pc.progress);
        if(pc.buildings) await storeSet('buildings', pc.buildings);
      }
      state.currentCourseId = savedCurrent;
    } else {
      // 旧形式（単一コース）のファイルにも対応
      if(data.markers) await storeSet('markers', data.markers);
      if(data['route-order']) await storeSet('route-order', data['route-order']);
      if(data['route-path']) await storeSet('route-path', data['route-path']);
      if(data['route-colors']) await storeSet('route-colors', data['route-colors']);
      if(data.progress) await storeSet('progress', data.progress);
      if(data.buildings) await storeSet('buildings', data.buildings);
      if(data.settings) await storeSet('settings', data.settings);
    }
    let summaryLines;
    if(Array.isArray(data.courses) && data.perCourse){
      summaryLines = data.courses.map(c => routeStatsLine(c.name, data.perCourse[c.id])).join('\n');
    } else {
      summaryLines = routeStatsLine('（このファイル）', {markers: data.markers, routePath: data['route-path']});
    }
    toast(`✓ データを読み込みました。反映します…\n${summaryLines}`, 4000);
    setTimeout(()=>location.reload(), 4000);
  }catch(e){
    console.error(e);
    toast('読み込みに失敗しました：' + e.message);
  }
}


/* ============ 元に戻す（CSV・変更点リンクを反映する直前の状態へ）============
   反映の直前に、地点（markers）・ルート順（route-order）・コース一覧・削除の記録だけを控えとして残す。
   進捗（配達完了）は控えに入れない：反映したあとに配達を進めていても、元に戻したときに完了が消えないようにするため。
   控えは最後の1回分だけ（次に反映すると、その直前の状態で上書きされる）。 */
const UNDO_KEY = STORAGE_PREFIX + 'undo-snapshot', UNDO_META = STORAGE_PREFIX + 'undo-meta';
const UNDO_RE = /^(markers|route-order|route-path|route-colors|buildings)::|^(courses-list|deleted-log)$/; // V50.5：ルート線、V50.6：建物も控えに入れる
function takeUndoSnapshot(label){
  try{
    const keys = {};
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(!k || !k.startsWith(STORAGE_PREFIX)) continue;
      const b = k.slice(STORAGE_PREFIX.length);
      if(UNDO_RE.test(b)) keys[b] = localStorage.getItem(k);
    }
    localStorage.removeItem(UNDO_KEY);
    localStorage.setItem(UNDO_KEY, JSON.stringify(keys));
    localStorage.setItem(UNDO_META, JSON.stringify({at: Date.now(), label: label||''}));
    return true;
  }catch(e){
    try{ localStorage.removeItem(UNDO_KEY); localStorage.removeItem(UNDO_META); }catch(x){}
    return false;
  }
}
function undoMeta(){ try{ return JSON.parse(localStorage.getItem(UNDO_META)||'null'); }catch(e){ return null; } }
function undoLabel(){
  const m = undoMeta(); if(!m) return '';
  const d = new Date(m.at);
  return (d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+'「'+m.label+'」';
}
async function undoLastCsvImport(){
  const m = undoMeta(); let snap = null;
  try{ snap = JSON.parse(localStorage.getItem(UNDO_KEY)||'null'); }catch(e){}
  if(!m || !snap){ toast('元に戻せる反映がありません'); return; }
  if(!confirm(undoLabel()+' を反映する前の状態に戻します。\n\n・地点・ルート順・ルート線・建物・コースが、反映する前に戻ります\n・反映したあとに自分で直した地点も、反映する前に戻ります\n・配達完了の記録（今日の進捗）はそのままです\n\nよろしいですか？')) return;
  try{
    const now = [];
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && k.startsWith(STORAGE_PREFIX) && UNDO_RE.test(k.slice(STORAGE_PREFIX.length))) now.push(k);
    }
    now.forEach(k=>{ if(!(k.slice(STORAGE_PREFIX.length) in snap)) localStorage.removeItem(k); }); // 反映で新しくできたコースなどを消す
    Object.keys(snap).forEach(b=>localStorage.setItem(STORAGE_PREFIX + b, snap[b]));
    localStorage.removeItem(UNDO_KEY); localStorage.removeItem(UNDO_META);
    state.courses = (await storeGet('courses-list')) || [];
    if(!state.courses.find(c=>c.id===state.currentCourseId) && state.courses.length){
      state.currentCourseId = state.courses[0].id;
      await storeSet('current-course-id', state.currentCourseId);
    }
    await reloadCourseData();
    toast('↩ 反映する前の状態に戻しました', 4000);
    render();
  }catch(e){
    console.error(e);
    toast('元に戻せませんでした: ' + e.message, 6000);
  }
}

/* ============ 変更点リンクの受け取り（編集アプリが作ったリンクを開いたとき）============
   リンクの「#chg=」以降に、変更した地点だけのCSVが圧縮されて入っている（外部のサーバーには送られない）。
   中身は既存の「CSVを読み込む」にそのまま渡す。確認の画面で「よろしいですか？」と出るので、押さなければ何も変わらない。 */
async function decodeLinkPart(tag, data){
  const b64 = data.replace(/-/g,'+').replace(/_/g,'/');
  const bin = atob(b64 + '==='.slice((b64.length+3)%4));
  const bytes = Uint8Array.from(bin, c=>c.charCodeAt(0));
  let buf = bytes;
  if(tag==='z'){
    const ds = new DecompressionStream('gzip');
    buf = new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(ds)).arrayBuffer());
  }
  return new TextDecoder('utf-8').decode(buf);
}
/* V50.5：リンクの「&rt=」（または「#rt=」）に、エディタで描いたルート線が入っていることがある。
   中身：{v:1, r:{コース名:{s:[[[緯度,経度],...],...], c:[色,...]}}}。そのコースの線を、まるごと入れ替える。 */
function parseRoutePayload(json){
  const o = JSON.parse(json); const out = {};
  if(!o) return out;
  // V50.6：o.b に建物 {コース名:[[緯度,経度,幅m,奥行m,向き,メモ,ID],...]}
  if(o.b){
    const B = {};
    Object.keys(o.b).forEach(n=>{
      B[n] = (o.b[n]||[]).map((x,i)=>({id: x[6] || ('bld_'+Date.now()+'_'+i+'_'+Math.random().toString(36).slice(2,6)), lat:+x[0], lng:+x[1], widthM:Math.max(1,+x[2]||8), heightM:Math.max(1,+x[3]||6), rotationDeg:+x[4]||0, memo:String(x[5]||'')}))
        .filter(b=>isFinite(b.lat)&&isFinite(b.lng));
    });
    Object.defineProperty(out, '__b', {value:B, enumerable:false});
  }
  if(!o.r) return out;
  Object.keys(o.r).forEach(n=>{
    const x = o.r[n] || {};
    const segs = (x.s||[]).map(seg=>(seg||[]).map(p=>({lat:+p[0], lng:+p[1]})).filter(p=>isFinite(p.lat)&&isFinite(p.lng))).filter(seg=>seg.length);
    out[n] = {segs, colors: segs.map((_,i)=>(x.c&&x.c[i])||'#E24B4A')};
  });
  return out;
}
function routePayloadText(rtPay, newNames){
  const lines = Object.keys(rtPay).map(n=>{
    const c = state.courses.find(x=>x.name===n);
    const k = rtPay[n].segs.length;
    if(!c && !(newNames||[]).includes(n)) return '・'+n+'：この端末にこのコースが無いため、線は入れません';
    let now = 0;
    if(c){ try{ const v = JSON.parse(localStorage.getItem(STORAGE_PREFIX+'route-path::'+c.id)||'[]'); now = Array.isArray(v) ? (v.length && typeof v[0].lat==='number' ? 1 : v.length) : 0; }catch(e){} }
    return '・'+n+'：'+(k ? '線'+k+'本に入れ替え' : '線を全部消す')+(now ? '（今の線'+now+'本は消えます）' : '');
  });
  let txt = lines.length ? '🛣 ルート線（販売所で描いた線に入れ替えます）\n'+lines.join('\n') : '';
  const B = rtPay.__b;
  if(B && Object.keys(B).length){
    const bl = Object.keys(B).map(n=>{
      const c = state.courses.find(x=>x.name===n), k = B[n].length;
      if(!c && !(newNames||[]).includes(n)) return '・'+n+'：この端末にこのコースが無いため、建物は入れません';
      let now = 0;
      if(c){ try{ const v = JSON.parse(localStorage.getItem(STORAGE_PREFIX+'buildings::'+c.id)||'[]'); now = Array.isArray(v) ? v.length : 0; }catch(e){} }
      return '・'+n+'：'+(k ? '建物'+k+'件に入れ替え' : '建物を全部消す')+(now ? '（今の建物'+now+'件は消えます）' : '');
    });
    txt += (txt ? '\n\n' : '') + '🏠 建物（販売所で書き込んだ建物に入れ替えます）\n'+bl.join('\n');
  }
  return txt;
}
async function applyRoutePayload(rtPay){
  for(const n of Object.keys(rtPay)){
    const c = state.courses.find(x=>x.name===n);
    if(!c) continue;
    await withCourseScope(c.id, async ()=>{
      await storeSet('route-path', rtPay[n].segs);
      await storeSet('route-colors', rtPay[n].colors);
    });
  }
  const B = rtPay.__b || {};
  for(const n of Object.keys(B)){
    const c = state.courses.find(x=>x.name===n);
    if(!c) continue;
    await withCourseScope(c.id, async ()=>{ await storeSet('buildings', B[n]); });
  }
}
async function importRoutesOnly(rtPay){
  const names = Object.keys(rtPay).concat(Object.keys(rtPay.__b||{}));
  if(!names.length){ toast('リンクにルート線・建物が入っていませんでした', 5000); return; }
  if(!names.some(n=>state.courses.find(x=>x.name===n))){ toast('リンクの線のコース（'+names.join('、')+'）が、この端末にありません。販売所に連絡してください', 8000); return; }
  const what = (Object.keys(rtPay).length ? 'ルート線' : '') + (rtPay.__b && Object.keys(rtPay.__b).length ? (Object.keys(rtPay).length ? '・建物' : '建物') : '');
  if(!confirm(what+'を反映します。\n\n'+routePayloadText(rtPay)+'\n\n※地点は変わりません。\n\nよろしいですか？')) return;
  if(!takeUndoSnapshot(what) && !confirm('元に戻す用の控えを保存できませんでした（端末の保存容量が足りない可能性があります）。\n\nこのまま反映しますか？')) return;
  await applyRoutePayload(rtPay);
  await reloadCourseData();
  toast('✓ '+what+'を反映しました。元に戻すときは「設定」→「↩ 直前の反映を元に戻す」', 6000);
  render();
}
async function receiveChangeLink(){
  try{
    const h = location.hash || '';
    const m = h.match(/^#(?:chg=([zr])\.([A-Za-z0-9_\-]+))?(?:&?rt=([zr])\.([A-Za-z0-9_\-]+))?$/);
    if(!m || (!m[2] && !m[4])) return;
    history.replaceState(null, '', location.pathname + location.search);
    const rtPay = m[4] ? parseRoutePayload(await decodeLinkPart(m[3], m[4])) : null;
    if(m[2]){
      const csv = await decodeLinkPart(m[1], m[2]);
      await importPointsCsv(new File([csv], '変更点.csv', {type:'text/csv'}), rtPay);
    } else {
      await importRoutesOnly(rtPay);
    }
  }catch(e){
    console.error(e);
    toast('変更点リンクを読み取れませんでした（リンクが途中で切れている可能性があります）', 6000);
  }
}

function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

// 日本の祝日を判定する（計算で求められる祝日を自動算出し、手動で追加・除外した分もあわせて反映する）。
// 春分の日・秋分の日は天文計算による近似式（1980〜2099年の範囲で信頼できる）。
// 一回限りの法改正による移動（例：2020年のオリンピック特例）までは追えないため、
// state.settings.customHolidays（追加）／state.settings.removedHolidays（除外）で手動調整できるようにしてある。
function computeJapaneseHolidaysForYear(year){
  const holidays = {}; // 'YYYY-MM-DD' -> 祝日名
  const add = (m, d, name) => { holidays[`${year}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`] = name; };
  const nthMonday = (month, n) => {
    const first = new Date(year, month-1, 1);
    const firstMonDay = 1 + ((8 - first.getDay()) % 7); // その月の最初の月曜日
    return firstMonDay + (n-1)*7;
  };
  add(1, 1, '元日');
  add(1, nthMonday(1,2), '成人の日');
  add(2, 11, '建国記念の日');
  add(2, 23, '天皇誕生日');
  const shunbun = Math.floor(20.8431 + 0.242194*(year-1980) - Math.floor((year-1980)/4));
  add(3, shunbun, '春分の日');
  add(4, 29, '昭和の日');
  add(5, 3, '憲法記念日');
  add(5, 4, 'みどりの日');
  add(5, 5, 'こどもの日');
  add(7, nthMonday(7,3), '海の日');
  add(8, 11, '山の日');
  add(9, nthMonday(9,3), '敬老の日');
  const shubun = Math.floor(23.2488 + 0.242194*(year-1980) - Math.floor((year-1980)/4));
  add(9, shubun, '秋分の日');
  add(10, nthMonday(10,2), 'スポーツの日');
  add(11, 3, '文化の日');
  add(11, 23, '勤労感謝の日');

  // 振替休日：祝日が日曜と重なった場合、その直後の「祝日でない日」が休日になる
  const dateKeys = Object.keys(holidays).sort();
  dateKeys.forEach(key=>{
    const d = new Date(key + 'T00:00:00');
    if(d.getDay() === 0){
      let next = new Date(d);
      do{ next.setDate(next.getDate()+1); } while(holidays[toDateKey(next)]);
      holidays[toDateKey(next)] = '振替休日';
    }
  });
  // 国民の休日：前後を祝日に挟まれた「祝日でない平日」も休日になる（ゴールデンウィークの5/4等、まれに他の年にも発生）
  Object.keys(holidays).slice().forEach(key=>{
    const d = new Date(key + 'T00:00:00');
    const prev = new Date(d); prev.setDate(prev.getDate()-1);
    const next = new Date(d); next.setDate(next.getDate()+1);
    if(!holidays[toDateKey(next)] && next.getDay()!==0){
      const nextNext = new Date(next); nextNext.setDate(nextNext.getDate()+1);
      if(holidays[toDateKey(nextNext)]) holidays[toDateKey(next)] = '国民の休日';
    }
  });
  return holidays;
}
function toDateKey(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
const _holidayCache = {};
function isJapaneseHoliday(dateStr){
  const year = parseInt(dateStr.slice(0,4), 10);
  if(!_holidayCache[year]) _holidayCache[year] = computeJapaneseHolidaysForYear(year);
  const removed = (state.settings.removedHolidays || []);
  const custom = (state.settings.customHolidays || []);
  if(removed.includes(dateStr)) return false;
  if(custom.includes(dateStr)) return true;
  return !!_holidayCache[year][dateStr];
}
function holidayNameFor(dateStr){
  const year = parseInt(dateStr.slice(0,4), 10);
  if(!_holidayCache[year]) _holidayCache[year] = computeJapaneseHolidaysForYear(year);
  const computedName = _holidayCache[year][dateStr];
  if(computedName) return computedName;
  if((state.settings.customHolidays||[]).includes(dateStr)) return '登録した祝日';
  return '';
}

// 開始日を基準に、testDateStrが何回目の「周年」を迎えた後かを数える。
// 例：開始日2026-06-01のとき、2026/6/1〜2027/5/31は0、2027/6/1〜2028/5/31は1、2028/6/1〜2029/5/31は2…
// 開始日より前の日付にも対応（負の値になる）。
function elapsedAnniversaryYears(startDateStr, testDateStr){
  const s = new Date(startDateStr + 'T12:00:00');
  const d = new Date(testDateStr + 'T12:00:00');
  let diff = d.getFullYear() - s.getFullYear();
  const sMonth = s.getMonth(), sDate = s.getDate();
  const dMonth = d.getMonth(), dDate = d.getDate();
  if(dMonth < sMonth || (dMonth === sMonth && dDate < sDate)) diff -= 1;
  return diff;
}

// 「交代読者」（1年ごとに配達先が入れ替わる契約）の判定。
// 開始日を含む1年間（周年0年目）を配達対象とし、以後1年ごとに対象・対象外を交互に繰り返す。
// 開始日が未設定の場合は判定できないため、常に対象（従来通り毎日対象）として扱う。
function isKoutaiDokushaActive(m, testDateStr){
  if(!m.condStartDate) return true;
  const y = elapsedAnniversaryYears(m.condStartDate, testDateStr);
  return (((y % 2) + 2) % 2) === 0;
}

// その地点が「指定した日（省略時は今日）」に配達対象かどうか。条件を何も設定していない地点は、これまで通り毎日対象（99%はここ）。
// 曜日（祝日を含む）・開始日・終了日は、設定したものだけ判定する（設定していない項目は無条件で通す）。
// 期間の繰り返しパターン（condRepeatMode）は3通り：
//   'none'   ：繰り返さない。開始日〜終了日の一度きりの期間（年月日まるごと比較）
//   'yearly' ：毎年繰り返す。年を無視し、月日だけで毎年判定（年をまたぐ期間にも対応）
//   'koutai' ：交代読者。開始日を基準に1年ごとに対象・対象外を交互に繰り返す
// 旧データ（condRepeatMode未設定・condRepeatYearlyのみ）にも対応する。
// testDateStrを省略した場合は、これまでと完全に同じ「今日」の判定になる（実際の配達・ナビ動作は不変）。
function isDeliverableToday(m, testDateStr){
  if(!m) return false;

  const today = testDateStr || todayStr();

  // 一時休止期間（③）：配達条件のON/OFFに関わらず、この期間内は問答無用で配達対象外にする
  // 休止終了が空のときは「再開日が決まるまで休止のまま」(2026-11-16)
  if(m.condPauseStart && today >= m.condPauseStart && (!m.condPauseEnd || today <= m.condPauseEnd)){
    return false;
  }

  if(!m.condEnabled) return true;

  if(m.condWeekdays && m.condWeekdays.length > 0){
    const todayDow = new Date(today + 'T12:00:00').getDay(); // 0=日,1=月,...,6=土
    const matchesWeekday = m.condWeekdays.includes(todayDow);
    const matchesHoliday = m.condWeekdays.includes(7) && isJapaneseHoliday(today);
    if(!matchesWeekday && !matchesHoliday) return false;
  }

  const repeatMode = m.condRepeatMode || (m.condRepeatYearly ? 'yearly' : 'none');

  if(repeatMode === 'koutai'){
    // 交代読者：まず開始日〜終了日（一度きりの期間と同じ絞り込み）で「今シーズン中」かを確認し、
    // そのうえで1年ごとの周期判定を行う
    if(m.condStartDate && today < m.condStartDate) return false;
    if(!isKoutaiDokushaActive(m, today)) return false;
  } else if(repeatMode === 'yearly'){
    const todayMD = today.slice(5); // 'MM-DD'
    const startMD = m.condStartDate ? m.condStartDate.slice(5) : null;
    const endMD = m.condEndDate ? m.condEndDate.slice(5) : null;
    if(startMD && endMD){
      if(startMD <= endMD){
        if(todayMD < startMD || todayMD > endMD) return false;
      } else {
        // 年をまたぐ期間（例：開始12/20・終了1/15）
        if(todayMD < startMD && todayMD > endMD) return false;
      }
    } else if(startMD && todayMD < startMD){
      return false;
    } else if(endMD && todayMD > endMD){
      return false;
    }
  } else {
    if(m.condStartDate && today < m.condStartDate) return false;
    if(m.condEndDate && today > m.condEndDate) return false;
  }
  return true;
}

function toast(msg, duration){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove('show'), duration || 2200);
}

/* ============ init ============ */
async function loadCourseList(){
  let courses = await storeGet('courses-list');
  let currentId = await storeGet('current-course-id');

  if(!courses || !courses.length){
    // 初回起動、またはコース機能導入前のデータからの移行
    // ここではまだ state.currentCourseId が未設定なので、storeGet('markers') 等は
    // 従来通りコース名なしのキーを読みに行く＝旧データがあればそれを拾える
    const legacyMarkers = await storeGet('markers');
    const legacyRouteOrder = await storeGet('route-order');
    const legacyProgress = await storeGet('progress');
    const legacyPath = await storeGet('route-path');

    const baseMarkers = (legacyMarkers && legacyMarkers.length) ? legacyMarkers : DEFAULT_MARKERS;
    const name = (baseMarkers[0] && baseMarkers[0].folder) ? baseMarkers[0].folder : '配達コース1';
    const id = 'c' + Date.now();

    courses = [{id, name, count: baseMarkers.length}];
    currentId = id;
    await storeSet('courses-list', courses);
    await storeSet('current-course-id', currentId);
    state.currentCourseId = currentId;

    baseMarkers.forEach(m=>{ if(!m.pinType) m.pinType = 'default'; });
    await storeSet('markers', baseMarkers);
    if(legacyRouteOrder && legacyRouteOrder.length) await storeSet('route-order', legacyRouteOrder);
    if(legacyProgress) await storeSet('progress', legacyProgress);
    if(legacyPath) await storeSet('route-path', legacyPath);
  } else {
    if(!currentId || !courses.find(c=>c.id===currentId)){
      currentId = courses[0].id;
      await storeSet('current-course-id', currentId);
    }
    state.currentCourseId = currentId;
  }
  state.courses = courses;
  // 書き出し（データの引き継ぎ）画面のチェック状態は、前回の選択を保存しておき、
  // アプリの再起動をまたいでも覚えておく。保存が無い（初回起動）場合や、
  // 保存されていたコースがすべて削除済みの場合だけ、今のコースを既定でチェックする。
  const savedExportIds = await storeGet('export-selected-course-ids');
  const validSavedIds = (savedExportIds || []).filter(id => courses.some(c => c.id === id));
  state.exportSelectedCourseIds = validSavedIds.length ? validSavedIds : [state.currentCourseId];
}

async function reloadCourseData(){
  const savedMarkers = await storeGet('markers');
  state.markers = (savedMarkers && savedMarkers.length) ? savedMarkers : [];
  state.markers.forEach(m=>{
    if(!m.pinType) m.pinType = 'default';
    if(m.isLandmark===undefined) m.isLandmark = false;
    if(m.isHidden===undefined) m.isHidden = false;
    if(m.customArriveDist===undefined) m.customArriveDist = null;
  });

  const savedBuildings = await storeGet('buildings');
  state.buildings = (savedBuildings && savedBuildings.length) ? savedBuildings : [];
  state.selectedBuildingId = null;

  const savedDeletedLog = await storeGet('deleted-log');
  state.deletedPointsLog = (savedDeletedLog && savedDeletedLog.length) ? savedDeletedLog : [];

  const savedRoute = await storeGet('route-order');
  const deliverableIds = state.markers.filter(m=>!m.isLandmark && !m.isHidden).map(m=>m.id);
  if(savedRoute && savedRoute.length){
    const known = new Set(savedRoute);
    state.routeOrder = savedRoute.filter(id=>deliverableIds.includes(id)).concat(deliverableIds.filter(id=>!known.has(id)));
  } else {
    state.routeOrder = [...state.markers].filter(m=>!m.isLandmark && !m.isHidden).sort((a,b)=>a.order-b.order).map(m=>m.id);
  }

  const savedProgress = await storeGet('progress');
  if(savedProgress && savedProgress.date === todayStr()){
    state.progress = savedProgress;
    if(!state.progress.doneMeta) state.progress.doneMeta = {};
    if(!state.progress.skippedIds) state.progress.skippedIds = [];
    if(!state.progress.trail) state.progress.trail = [];
  } else {
    // 日付が変わっていたら、消してしまう前に前日の軌跡・配達済み地点を「履歴」として残しておく
    // （配達ルートのデータとは別の場所に保存するため、普段の編集画面とは混ざらない）
    if(savedProgress && savedProgress.trail && savedProgress.trail.length){
      const savedHistory = await storeGet('trailHistory');
      state.trailHistory = savedHistory || [];
      const donePoints = (savedProgress.done || []).map(id=>{
        const m = state.markers.find(x=>x.id===id);
        const meta = savedProgress.doneMeta ? savedProgress.doneMeta[id] : null;
        return m ? {id, name:m.name||'', lat:m.lat, lng:m.lng, time: meta ? meta.time : null} : null;
      }).filter(Boolean);
      state.trailHistory.push({date: savedProgress.date, trail: savedProgress.trail, donePoints});
      if(state.trailHistory.length > 60) state.trailHistory.splice(0, state.trailHistory.length - 60); // 古すぎるものは残しすぎない
      await storeSet('trailHistory', state.trailHistory);
    } else {
      const savedHistory = await storeGet('trailHistory');
      state.trailHistory = savedHistory || [];
    }
    state.progress = {date: todayStr(), done: [], doneMeta:{}, skippedIds:[], trail:[]};
    await storeSet('progress', state.progress);
  }

  const savedPath = await storeGet('route-path');
  if(savedPath && Array.isArray(savedPath) && savedPath.length){
    // 新形式：[[{lat,lng},...], [{lat,lng},...]]／旧形式：[{lat,lng},...]（1本の線として扱う）
    const isOldFlatFormat = savedPath[0] && typeof savedPath[0].lat === 'number';
    state.routeSegments = isOldFlatFormat ? [savedPath] : savedPath;
  } else {
    state.routeSegments = [];
  }
  const savedColors = await storeGet('route-colors');
  state.segmentColors = (savedColors && Array.isArray(savedColors)) ? savedColors : [];
  state.awaitingNewSegment = true;
  // 「保存する」前の未保存編集を検知するための、読み込み直後の状態のスナップショット
  state.savedRouteSnapshot = JSON.stringify({segs: state.routeSegments, colors: state.segmentColors});

  state.announced = {};
  state.proximityTracking = {};

  // コース一覧の件数表示を最新化
  const c = state.courses.find(x=>x.id===state.currentCourseId);
  if(c){ c.count = state.markers.length; storeSet('courses-list', state.courses); }
}

async function init(){
  // ブラウザは、端末の空き容量が少なくなると、サイトごとの保存データ（localStorage等）を
  // 判断で消してしまうことがある。「このサイトのデータは大事なので優先して残してください」と
  // 明示的にお願いすることで、軌跡の履歴などが消えにくくなる（対応していないブラウザでは
  // 何も起きないだけなので、常に呼んで問題ない）。
  try{
    if(navigator.storage && navigator.storage.persist){
      navigator.storage.persist();
    }
  }catch(e){}

  const accepted = await storeGet('termsAccepted');
  state.termsAccepted = !!accepted;
  if(!state.termsAccepted){
    // 同意がまだなら、それ以外の初期化はせず、まず同意画面だけを表示する
    render();
    return;
  }

  await loadCourseList();
  await reloadCourseData();

  const savedSettings = await storeGet('settings');
  if(savedSettings) state.settings = Object.assign(state.settings, savedSettings);
  // 距離設定の範囲を変更したため、古い保存値が新しい範囲を超えていたら収める
  state.settings.announceDist = Math.min(Math.max(state.settings.announceDist, 10), 50);
  state.settings.arriveDist = Math.min(Math.max(state.settings.arriveDist, 5), 50);
  state.settings.stopSpeedKmh = Math.min(Math.max(state.settings.stopSpeedKmh, 1), 15);

  render();
  receiveChangeLink();
}

async function acceptTerms(){
  state.termsAccepted = true;
  await storeSet('termsAccepted', true);
  // 同意されたので、ここで初めて本来の初期化を行う
  await loadCourseList();
  await reloadCourseData();
  const savedSettings = await storeGet('settings');
  if(savedSettings) state.settings = Object.assign(state.settings, savedSettings);
  state.settings.announceDist = Math.min(Math.max(state.settings.announceDist, 10), 50);
  state.settings.arriveDist = Math.min(Math.max(state.settings.arriveDist, 5), 50);
  state.settings.stopSpeedKmh = Math.min(Math.max(state.settings.stopSpeedKmh, 1), 15);
  render();
  receiveChangeLink();
}

/* ============ geo utils ============ */
function toRad(d){ return d*Math.PI/180; }
function extractPointNumber(name){
  // 地点名の中から番号を取り出す。「1-1」のようなハイフン付きの形式があればそれを優先し、
  // なければ単独の数字（例:「(1)木のハコ」→「1」）を使う。全角数字は半角に変換する。
  if(!name) return '';
  const normalized = String(name).replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
  const dashMatch = normalized.match(/\d+-\d+/);
  if(dashMatch) return dashMatch[0].slice(0, 5);
  const m = normalized.match(/\d+/);
  return m ? m[0].slice(0, 5) : '';
}
function getRouteNumber(id){
  // 地点名の番号は複数の地点で重複することがあるため（例：「(1)木のハコ」と「(1)柱に…」が両方「1」になる）、
  // 地図・一覧のラベルには、必ず重複しない「その日の配達順」を使う
  const idx = state.routeOrder.indexOf(id);
  return idx >= 0 ? String(idx + 1) : '';
}
function buildPointNumberLabels(){
  // 名前についている番号（例：「1-14」）をそのまま使いたいが、重複する場合は
  // 番号自体は残しつつ「①②③」を付けて区別する（元の番号との繋がりを失わないため）
  const counts = {};
  const extracted = {};
  state.markers.forEach(m=>{
    if(m.isLandmark) return;
    const num = extractPointNumber(m.name);
    extracted[m.id] = num;
    if(num) counts[num] = (counts[num] || 0) + 1;
  });
  const CIRCLED = ['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩','⑪','⑫','⑬','⑭','⑮','⑯','⑰','⑱','⑲','⑳'];
  const seenOrder = {}; // 番号ごとに、今まで何件目に登場したか（配達順に走査するため、routeOrder順に処理する）
  const labels = {};
  const orderedIds = state.routeOrder.filter(id => extracted[id] !== undefined);
  orderedIds.forEach(id=>{
    const num = extracted[id];
    if(!num){
      labels[id] = getRouteNumber(id);
      return;
    }
    if(counts[num] === 1){
      labels[id] = num;
    } else {
      seenOrder[num] = (seenOrder[num] || 0) + 1;
      const suffix = CIRCLED[seenOrder[num] - 1] || `(${seenOrder[num]})`;
      labels[id] = num + suffix;
    }
  });
  // routeOrderに含まれない地点（配達対象外・目印など）も念のため処理しておく
  state.markers.forEach(m=>{
    if(m.isLandmark || labels[m.id] !== undefined) return;
    labels[m.id] = getRouteNumber(m.id);
  });
  return labels;
}
function haversine(lat1,lng1,lat2,lng2){
  const R=6371000;
  const dLat=toRad(lat2-lat1), dLng=toRad(lng2-lng1);
  const a=Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function bearing(lat1,lng1,lat2,lng2){
  const y = Math.sin(toRad(lng2-lng1))*Math.cos(toRad(lat2));
  const x = Math.cos(toRad(lat1))*Math.sin(toRad(lat2)) - Math.sin(toRad(lat1))*Math.cos(toRad(lat2))*Math.cos(toRad(lng2-lng1));
  let brng = toRad2deg(Math.atan2(y,x));
  return (brng+360)%360;
}

/* ============ 建物（地図に無い家など）の図形を扱うための計算 ============
   中心座標＋幅・高さ（メートル）＋回転角度（北から時計回り、度）で1棟を表す。
   実際の緯度経度への変換は、中心付近だけの狭い範囲なので、平面近似（メートル換算）で行う。 */
const METERS_PER_DEG_LAT = 111320;
function metersPerDegLngAt(lat){ return 111320 * Math.cos(lat * Math.PI/180); }

// 中心からの東西方向(dxM)・南北方向(dyM)のオフセット（メートル）を、緯度経度に変換する
function offsetMetersToLatLng(centerLat, centerLng, dxM, dyM){
  return {
    lat: centerLat + dyM / METERS_PER_DEG_LAT,
    lng: centerLng + dxM / metersPerDegLngAt(centerLat)
  };
}
// 緯度経度を、中心からの東西・南北オフセット（メートル）に変換する
function latLngToOffsetMeters(centerLat, centerLng, lat, lng){
  return {
    dx: (lng - centerLng) * metersPerDegLngAt(centerLat),
    dy: (lat - centerLat) * METERS_PER_DEG_LAT
  };
}
// 建物自身の「回転していない」ローカル座標(ux=東方向,uy=北方向)を、
// rotDeg（北から時計回り）だけ回転させた、実際の東西・南北オフセットに変換する
function rectLocalToGeoOffset(ux, uy, rotDeg){
  const rad = rotDeg * Math.PI/180, cos = Math.cos(rad), sin = Math.sin(rad);
  return { dx: ux*cos + uy*sin, dy: -ux*sin + uy*cos };
}
// その逆（実際の東西・南北オフセット → 建物の回転していないローカル座標）
function geoOffsetToRectLocal(dx, dy, rotDeg){
  const rad = rotDeg * Math.PI/180, cos = Math.cos(rad), sin = Math.sin(rad);
  return { ux: dx*cos - dy*sin, uy: dx*sin + dy*cos };
}
// 建物の4つの角（北東・北西・南西・南東）の緯度経度を返す
function buildingCorners(b){
  const hw = b.widthM/2, hh = b.heightM/2;
  const signs = { ne:[1,1], nw:[-1,1], sw:[-1,-1], se:[1,-1] };
  const out = {};
  for(const key in signs){
    const [sx, sy] = signs[key];
    const off = rectLocalToGeoOffset(sx*hw, sy*hh, b.rotationDeg||0);
    out[key] = offsetMetersToLatLng(b.lat, b.lng, off.dx, off.dy);
  }
  return out;
}
// 建物の回転ハンドル（北の辺の外側）の緯度経度を返す
function buildingRotateHandle(b){
  const hh = b.heightM/2;
  const off = rectLocalToGeoOffset(0, hh + Math.max(2, b.heightM*0.3), b.rotationDeg||0);
  return offsetMetersToLatLng(b.lat, b.lng, off.dx, off.dy);
}
// 建物の角(cornerKey: 'ne'|'nw'|'sw'|'se')を新しい緯度経度にドラッグしたときの、
// 新しい中心座標・幅・高さを計算する（対角の角は固定したまま伸縮する）
function resizeBuildingByCorner(b, cornerKey, newLat, newLng){
  const signs = { ne:[1,1], nw:[-1,1], sw:[-1,-1], se:[1,-1] };
  const [sx, sy] = signs[cornerKey];
  const hw = b.widthM/2, hh = b.heightM/2;
  const rot = b.rotationDeg||0;

  // 現在の「対角（アンカー）」の実際の位置（中心からのオフセット）
  const anchorOff = rectLocalToGeoOffset(-sx*hw, -sy*hh, rot);
  // ドラッグ先の点の、現在の中心からのオフセット
  const dragOff = latLngToOffsetMeters(b.lat, b.lng, newLat, newLng);

  // 新しい中心＝アンカーとドラッグ先の中間点
  const newCenterOff = { dx:(anchorOff.dx+dragOff.dx)/2, dy:(anchorOff.dy+dragOff.dy)/2 };
  const newCenter = offsetMetersToLatLng(b.lat, b.lng, newCenterOff.dx, newCenterOff.dy);

  // 新しい中心から見た「ドラッグ先の角」までのオフセット
  const halfDiagOff = { dx:(dragOff.dx-anchorOff.dx)/2, dy:(dragOff.dy-anchorOff.dy)/2 };
  const local = geoOffsetToRectLocal(halfDiagOff.dx, halfDiagOff.dy, rot);

  const MIN_M = 1; // 縮めすぎ防止（最小1m四方）
  const newWidthM = Math.max(MIN_M, Math.abs(local.ux)*2);
  const newHeightM = Math.max(MIN_M, Math.abs(local.uy)*2);

  return { lat:newCenter.lat, lng:newCenter.lng, widthM:newWidthM, heightM:newHeightM };
}
function toRad2deg(r){ return r*180/Math.PI; }
const COMPASS = ['北','北北東','北東','東北東','東','東南東','南東','南南東','南','南南西','南西','西南西','西','西北西','北西','北北西'];
function compassText(deg){
  const idx = Math.round(deg/22.5) % 16;
  return COMPASS[idx];
}

/* ---- 交差するルートを山なり（ジャンプ）表示するための処理 ---- */
function segIntersect(p1,p2,p3,p4){
  const d1x=p2.x-p1.x, d1y=p2.y-p1.y;
  const d2x=p4.x-p3.x, d2y=p4.y-p3.y;
  const denom = d1x*d2y - d1y*d2x;
  if(Math.abs(denom) < 1e-9) return null;
  const t1 = ((p3.x-p1.x)*d2y - (p3.y-p1.y)*d2x) / denom;
  const t2 = ((p3.x-p1.x)*d1y - (p3.y-p1.y)*d1x) / denom;
  if(t1 > 0.03 && t1 < 0.97 && t2 > 0.03 && t2 < 0.97){
    return { t1, t2 };
  }
  return null;
}
function buildRoutePoints(routePath){
  if(!routePath || routePath.length < 2) return (routePath||[]).map(p=>[p.lat,p.lng]);
  const latOrigin = routePath.reduce((s,p)=>s+p.lat,0)/routePath.length;
  const lngOrigin = routePath.reduce((s,p)=>s+p.lng,0)/routePath.length;
  const cosLat = Math.cos(latOrigin*Math.PI/180);
  const project = p => ({ x:(p.lng-lngOrigin)*111320*cosLat, y:(p.lat-latOrigin)*110540 });
  const unproject = pt => ({ lat: latOrigin + pt.y/110540, lng: lngOrigin + pt.x/(111320*cosLat) });

  const pts = routePath.map(project);
  const n = pts.length;

  // 自己交差ペアを検出（隣接区間は除外）。後から描かれた区間（インデックスが大きい方）に山なりを付ける
  const bumps = {};
  for(let i=0;i<n-1;i++){
    for(let j=i+2;j<n-1;j++){
      const inter = segIntersect(pts[i],pts[i+1],pts[j],pts[j+1]);
      if(inter){
        if(!bumps[j]) bumps[j]=[];
        bumps[j].push(inter.t2);
      }
    }
  }

  const out = [pts[0]];
  for(let i=0;i<n-1;i++){
    const A=pts[i], B=pts[i+1];
    const segBumps = (bumps[i]||[]).slice().sort((a,b)=>a-b);
    if(!segBumps.length){ out.push(B); continue; }

    const segLen = Math.hypot(B.x-A.x, B.y-A.y) || 1;
    const dirx=(B.x-A.x)/segLen, diry=(B.y-A.y)/segLen;
    const perpx=-diry, perpy=dirx;
    const bumpHeight = Math.min(4.5, segLen*0.22);
    const halfWidth = Math.min(segLen*0.14, 6);

    segBumps.forEach(t=>{
      const distAlong = t*segLen;
      const startD = Math.max(0, distAlong-halfWidth);
      const endD = Math.min(segLen, distAlong+halfWidth);
      const steps = 10;
      for(let s=1;s<=steps;s++){
        const dd = startD + (endD-startD)*(s/steps);
        const local = (dd-startD)/Math.max(1e-6,(endD-startD));
        const bump = Math.sin(local*Math.PI) * bumpHeight;
        out.push({ x: A.x+dirx*dd+perpx*bump, y: A.y+diry*dd+perpy*bump });
      }
    });
    out.push(B);
  }
  return out.map(pt=>{ const ll = unproject(pt); return [ll.lat, ll.lng]; });
}

let audioCtx = null;
function playPing(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.frequency.value = 880;
    const now = audioCtx.currentTime;
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(0.35, now + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.28);
    osc.start(now);
    osc.stop(now + 0.3);
  }catch(e){}
}
function unlockAudio(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
  }catch(e){}
}

/* ---- 進行方向（コンパス）を地図の上にする「ヘディングアップ」表示 ---- */
let orientationListenerAttached = false;
function requestOrientationPermission(){
  if(!state.settings.headingUp) return;
  try{
    if(typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function'){
      DeviceOrientationEvent.requestPermission().then(resp=>{
        if(resp === 'granted') attachOrientationListener();
      }).catch(()=>{});
    } else {
      attachOrientationListener();
    }
  }catch(e){}
  // ジャイロ・加速度センサー（DeviceMotionEvent）も、許可が必要な端末（主にiOS）では
  // 別途リクエストする。方位そのものの計算には使わず、「今まさに体が回転しているか」を
  // 確認する補助信号としてのみ使う（軸の対応関係を実機で確認できないため、安全のため）。
  try{
    if(typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function'){
      DeviceMotionEvent.requestPermission().then(resp=>{
        if(resp === 'granted') attachMotionListener();
      }).catch(()=>{});
    } else {
      attachMotionListener();
    }
  }catch(e){}
}
let headingSmoothX = null, headingSmoothY = null;
let headingOutlierStreak = 0; // コンパスの大きなズレが何回連続したか（本物の方向転換か判定するため）
let lastAppliedHeading = null;
let headingThrottleTimer = null;

let motionListenerAttached = false;
let gyroRotationMagnitude = 0; // 直近のジャイロの回転の速さ（度/秒、絶対値）。どの軸かは問わず大きさだけを見る
const GYRO_TURN_THRESHOLD = 15; // これ以上の回転速度なら「実際に体が回転している」とみなす目安（度/秒）

function attachMotionListener(){
  if(motionListenerAttached) return;
  motionListenerAttached = true;
  const handler = (e)=>{
    const r = e.rotationRate;
    if(!r || (r.alpha==null && r.beta==null && r.gamma==null)) return;
    const a = r.alpha||0, b = r.beta||0, g = r.gamma||0;
    // スマホの持ち方（縦・横・平置き）によって「コンパス方向の回転」がどの軸に
    // 対応するかは実機でしか確定できないため、特定の軸には頼らず、3軸まとめた
    // 「回転の速さの大きさ」だけを見る。軸の対応を仮に取り違えていても、
    // 「今まさに回転しているかどうか」という判定自体は狂わない。
    const magnitude = Math.sqrt(a*a + b*b + g*g);
    gyroRotationMagnitude = gyroRotationMagnitude*0.7 + magnitude*0.3; // 軽く平滑化してノイズを抑える
  };
  try{ window.addEventListener('devicemotion', handler, true); }catch(e){}
}

function attachOrientationListener(){
  if(orientationListenerAttached) return;
  orientationListenerAttached = true;
  const handler = (e)=>{
    let heading = null;
    if(e.webkitCompassHeading != null){
      heading = e.webkitCompassHeading; // iOS Safari：真北からの方位がそのまま入る
    } else if(e.alpha != null){
      heading = 360 - e.alpha; // Android等の近似値
    }
    if(heading == null || isNaN(heading)) return;
    heading = (heading + 360) % 360;

    // コンパスの値は静止していても細かく揺れるため、円環方向の指数移動平均で滑らかにする
    const rad = heading * Math.PI / 180;
    const x = Math.cos(rad), y = Math.sin(rad);
    const SMOOTHING = 0.025; // 小さいほど滑らかだが反応が遅くなる
    if(headingSmoothX == null){
      headingSmoothX = x; headingSmoothY = y;
      headingOutlierStreak = 0;
    } else {
      // 外れ値除去：直前の平滑化済みの向きから大きく（90度以上）離れた値は、
      // 磁気の乱れによる一時的なノイズの可能性があるため、最初は弱くしか反映しない。
      // ただし、体を実際に反転させた（Uターン等）場合は同じ方向のズレが連続するはずなので、
      // 3回続けて同じような大きなズレが検出されたら「本物の向き」と判断し、すぐに追従する。
      // ジャイロが同時に大きな回転を検知していれば、3回待たずにその場で「本物」と判断する
      // （ジャイロは磁力の影響を受けないため、実際に回転しているかどうかの裏付けになる）。
      const prevAngle = (Math.atan2(headingSmoothY, headingSmoothX) * 180 / Math.PI + 360) % 360;
      let diff = Math.abs(heading - prevAngle);
      if(diff > 180) diff = 360 - diff;
      let effectiveSmoothing = SMOOTHING;
      if(diff > 90){
        const gyroConfirms = gyroRotationMagnitude >= GYRO_TURN_THRESHOLD;
        headingOutlierStreak++;
        if(headingOutlierStreak >= 3 || gyroConfirms){
          // 3回連続で大きくズレている、またはジャイロが回転を裏付けている＝本物の方向転換とみなし、その場でスナップする
          headingSmoothX = x; headingSmoothY = y;
          headingOutlierStreak = 0;
          state.currentHeading = heading;
          if(!headingThrottleTimer){
            headingThrottleTimer = setTimeout(()=>{ headingThrottleTimer = null; applyMapRotationIfChanged(); }, 1200);
          }
          return;
        }
        effectiveSmoothing = SMOOTHING * 0.15; // 1〜2回目は、念のため弱めにしか反映しない
      } else {
        headingOutlierStreak = 0;
      }
      headingSmoothX += effectiveSmoothing * (x - headingSmoothX);
      headingSmoothY += effectiveSmoothing * (y - headingSmoothY);
    }
    state.currentHeading = (Math.atan2(headingSmoothY, headingSmoothX) * 180 / Math.PI + 360) % 360;

    // 画面への反映も間引く（振動を防ぐため、一定間隔・一定以上の変化のときだけ動かす）
    if(!headingThrottleTimer){
      headingThrottleTimer = setTimeout(()=>{
        headingThrottleTimer = null;
        applyMapRotationIfChanged();
      }, 1200);
    }
  };
  try{ window.addEventListener('deviceorientationabsolute', handler, true); }catch(e){}
  try{ window.addEventListener('deviceorientation', handler, true); }catch(e){}
}
let continuousRotation = 0;      // 巻き戻り（0/360度の境界）が起きないようにするための連続角度
let continuousRotationReady = false;

// ---- ヘディングアップに使う方位の選択（コンパス vs GPS進行方向のハイブリッド） ----
// バイクのモーターや金属部品の磁力でコンパス（磁気センサー）は簡単に狂うが、
// ある程度の速度で走っている間はGPSの移動軌跡（movementHeading）の方が磁力の影響を受けず正確。
// 時速5km以上になったらGPSの進行方向を採用する。
// 5km以下（停止中・低速時）は、設定「低速・停止時にコンパスを使う」がONの場合のみコンパスにフォールバックする。
// OFF（初期設定・推奨）の場合は、あえて向きを変えずに直前のヘディングアップの向きを維持する
// （車内・バイク上ではコンパスがそもそも信用できないため）。
const GPS_HEADING_MIN_KMH = 2;          // この速度以上ならGPSの進行方向を優先する（歩行速度でも使えるよう引き下げ）
const MOVEMENT_HEADING_MAX_AGE_MS = 10000; // movementHeadingがこの時間より古い場合は使わない（徒歩でも猶予を持たせる）
const MOVEMENT_HEADING_MIN_DISTANCE_M = 8; // GPSの2点間から進行方向を計算し直す最小移動距離（GPSの誤差に埋もれないよう、以前の1.5mより長くした）

function getDisplayHeading(){
  const speedKmh = state.pos ? state.pos.speedKmh : null;
  const now = Date.now();
  const movementFresh = state.movementHeading != null
    && state.movementHeadingUpdatedAt != null
    && (now - state.movementHeadingUpdatedAt) < MOVEMENT_HEADING_MAX_AGE_MS;
  if(movementFresh && speedKmh != null && speedKmh >= GPS_HEADING_MIN_KMH){
    return state.movementHeading; // 走行中：磁力の影響を受けないGPS進行方向を採用
  }
  if(state.settings.useCompassFallback){
    return state.currentHeading; // 設定でONの場合のみ、低速・停止時はコンパスを使う
  }
  return lastAppliedHeading; // 初期設定（OFF）：低速・停止時は直前の向きをあえて変えずに維持する
}

function applyMapRotationIfChanged(){
  const heading = getDisplayHeading();
  if(heading == null) return;
  if(lastAppliedHeading != null){
    let diff = Math.abs(heading - lastAppliedHeading);
    if(diff > 180) diff = 360 - diff;
    // デッドバンド（これ未満の変化は無視する）は、速度が遅いほど広くする。
    // 低速時はGPSの進行方向がノイズの影響を受けやすく、ちょっとした揺れでも
    // 地図がくるくる回っているように感じられるため。
    const speedKmh = state.pos && state.pos.speedKmh != null ? state.pos.speedKmh : 0;
    let deadband;
    if(speedKmh < 5) deadband = 28;
    else if(speedKmh < 12) deadband = 18;
    else deadband = 12;
    if(diff < deadband) return;
  }
  lastAppliedHeading = heading;
  applyMapRotation();
}
function applyMapRotation(){

  const el = document.getElementById('miniMap');
  const heading = getDisplayHeading();
  if(!el || heading==null) return;
  syncMiniMapTransformOrigin(); // 回転する前に、必ず今の実際のカード高さに軸を合わせ直す

  const targetAngle = -heading; // 表示したい角度（0〜360相当、まだ巻き戻りを含む）
  if(!continuousRotationReady){
    continuousRotation = targetAngle;
    continuousRotationReady = true;
  } else {
    // 直前の角度から見て最短の向きになるよう、360度単位でずらしてから足す
    // （これをしないと0度と360度の境界で1回転してしまう）
    let diff = ((targetAngle - continuousRotation) % 360 + 360) % 360; // 必ず0〜360の範囲に正規化
    if(diff > 180) diff -= 360; // -180〜+180の最短経路に変換
    // diffは必ず-180〜+180の範囲内 → 1回転以上は絶対に起きない
    continuousRotation += diff;
    // ここで0〜360度の範囲に戻してはいけない。CSSのtransformアニメーションは、
    // 直前の実際の数値からの「そのままの差」で滑らかに回転するため、
    // 350度→370度のようにcontinuousRotationを連続した数値のまま増減させ続ける必要がある。
    // （350度→10度のように範囲に戻してしまうと、CSSはその数値の差＝340度分を
    // 逆回転で埋めようとしてしまい、まさに「180度を超える不要な回転」の原因になっていた）
  }
  el.style.transform = `translate(-50%,-50%) rotate(${continuousRotation}deg)`;
  updateNorthBadge();
  // 地図はドラッグ操作を常に許可する（手で動かして周辺を確認できるように）
  // ※回転の軸(transform-origin)がすでに自車の画面上の位置に正確に合わせてあるため、
  //   回転中に地図を動かし直す処理は不要（むしろCSS回転の途中でLeafletの内部計算を
  //   やり直させることになり、回転が終わるまでの間、位置がおかしくなる原因になる）。
}
function snapToNorthUpForInspection(){
  // 追従が止まっている間（🎯で目的地を見ている間・手で動かしている間）は、
  // 操作しやすいよう北向きに戻す

  const needle = document.querySelector('#northBadge .north-needle');

  continuousRotationReady = true;
}
function resumeRotationForFollow(){

}
function updateNorthBadge(){
